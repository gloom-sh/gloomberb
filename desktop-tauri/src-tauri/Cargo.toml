[package]
name = "gloom-tauri"
version = "0.19.2"
description = "Prototype: the Gloom desktop app in a Tauri shell with a Bun sidecar"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
