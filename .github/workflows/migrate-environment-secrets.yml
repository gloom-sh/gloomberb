name: Transfer existing workflow inputs to environments

on:
  workflow_dispatch:

permissions: {}

jobs:
  seal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'gloom-sh/gloomberb'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the reviewed hosted image and crypto library
        run: |
          /usr/bin/python3 -I - <<'PY'
          import ctypes
          import hashlib
          import os
          from pathlib import Path
          import platform
          import sys

          try:
              if (os.environ.get("RUNNER_ENVIRONMENT"), os.environ.get("ImageOS"), os.environ.get("ImageVersion"), platform.machine()) != (
                  "github-hosted", "ubuntu24", "20261111.370.1", "x86_64"
              ):
                  raise ValueError()
              library = Path("/usr/lib/x86_64-linux-gnu/libsodium.so.23.3.0")
              if hashlib.sha256(library.read_bytes()).hexdigest() != "fe00408090ea084504d7cb0130af56a22554fe299034b864551b65a64ca8a7b5":
                  raise ValueError()
              sodium = ctypes.CDLL(str(library))
              sodium.sodium_version_string.restype = ctypes.c_char_p
              if sodium.sodium_init() < 0 or sodium.sodium_version_string() != b"1.0.18":
                  raise ValueError()
          except Exception:
              sys.exit("Reviewed hosted crypto runtime unavailable.")
          PY

      - name: Seal the fixed input inventory
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_APPLEAPIKEY_BASE64: ${{ secrets.ELECTROBUN_APPLEAPIKEY_BASE64 }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PLATFORM_DISPATCH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          /usr/bin/python3 -I - <<'PY'
          import base64
          import ctypes
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import resource
          import sys

          APPLE = (
              "APPLE_CERTIFICATE_BASE64", "APPLE_CERTIFICATE_PASSWORD", "APPLE_KEYCHAIN_PASSWORD",
              "ELECTROBUN_APPLEAPIKEY", "ELECTROBUN_APPLEAPIKEY_BASE64",
              "ELECTROBUN_APPLEAPIISSUER", "ELECTROBUN_DEVELOPER_ID",
          )
          INVENTORY = {
              **{name: ("release", "signing-main") for name in (*APPLE, "HOMEBREW_TAP_TOKEN")},
              "PLATFORM_DISPATCH_TOKEN": ("release",),
              "CLOUDFLARE_ACCOUNT_ID": ("web-production",),
              "CLOUDFLARE_API_TOKEN": ("web-production",),
          }
          PUBLIC_KEYS = {
              "release": ("3380204578043523366", "1EICsPRrBJFB/ohu4+b+++XbIGXOzWgum3p8aQ1ZuBA="),
              "signing-main": ("3380204578043523366", "xEdCzMh0kTvfIeemDtpZZqg8//Jowdb6jOqBgHolWQ4="),
              "web-production": ("3380204578043523366", "5mkPg0eNza8muHbMcE0GtxYWNkgP1W3Hd86+0LqeIk4="),
          }

          def configure(sodium):
              sodium.sodium_init.restype = ctypes.c_int
              sodium.sodium_version_string.restype = ctypes.c_char_p
              sodium.crypto_box_publickeybytes.restype = ctypes.c_size_t
              sodium.crypto_box_sealbytes.restype = ctypes.c_size_t
              sodium.crypto_box_seal.argtypes = (ctypes.c_void_p, ctypes.c_char_p, ctypes.c_ulonglong, ctypes.c_char_p)
              sodium.crypto_box_seal.restype = ctypes.c_int
              if sodium.sodium_init() < 0 or sodium.crypto_box_publickeybytes() != 32 or sodium.crypto_box_sealbytes() != 48:
                  raise ValueError()
              return sodium

          def load_sodium():
              if (os.environ.get("RUNNER_ENVIRONMENT"), os.environ.get("ImageOS"), os.environ.get("ImageVersion"), platform.machine()) != (
                  "github-hosted", "ubuntu24", "20261111.370.1", "x86_64"
              ):
                  raise ValueError()
              library = Path("/usr/lib/x86_64-linux-gnu/libsodium.so.23.3.0")
              if hashlib.sha256(library.read_bytes()).hexdigest() != "fe00408090ea084504d7cb0130af56a22554fe299034b864551b65a64ca8a7b5":
                  raise ValueError()
              sodium = configure(ctypes.CDLL(str(library)))
              if sodium.sodium_version_string() != b"1.0.18":
                  raise ValueError()
              return sodium

          def seal_values(sodium, values, public_keys):
              if set(public_keys) != {"release", "signing-main", "web-production"} or set(values) != set(INVENTORY):
                  raise ValueError()
              keys = {}
              for destination, (key_id, encoded) in public_keys.items():
                  public_key = base64.b64decode(encoded, validate=True)
                  if not key_id.isdecimal() or len(public_key) != 32 or base64.b64encode(public_key).decode("ascii") != encoded:
                      raise ValueError()
                  keys[destination] = public_key
              if len(set(keys.values())) != 3:
                  raise ValueError()
              messages = {name: value.encode("utf-8") for name, value in values.items()}
              if any(not message or len(message) > 49152 for message in messages.values()):
                  raise ValueError()
              entries = []
              for name, destinations in INVENTORY.items():
                  for destination in destinations:
                      ciphertext = ctypes.create_string_buffer(len(messages[name]) + 48)
                      if sodium.crypto_box_seal(ciphertext, messages[name], len(messages[name]), keys[destination]) != 0:
                          raise ValueError()
                      entries.append({
                          "environment": destination, "name": name, "key_id": public_keys[destination][0],
                          "encrypted_value": base64.b64encode(ciphertext.raw).decode("ascii"),
                      })
              if len(entries) != 19:
                  raise ValueError()
              return {"secrets": entries}

          def main():
              try:
                  resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
                  if (os.environ.get("GITHUB_REPOSITORY"), os.environ.get("GITHUB_REF"), os.environ.get("GITHUB_EVENT_NAME")) != (
                      "gloom-sh/gloomberb", "refs/heads/main", "workflow_dispatch"
                  ) or os.environ.get("RUNNER_DEBUG") == "1":
                      raise ValueError()
                  sodium = load_sodium()
                  result = seal_values(sodium, {name: os.environ.get(name, "") for name in INVENTORY}, PUBLIC_KEYS)
                  artifact = Path(os.environ["RUNNER_TEMP"]) / "environment-secrets.json"
                  descriptor = os.open(artifact, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(descriptor, "w", encoding="utf-8") as output:
                      json.dump(result, output, separators=(",", ":"))
              except Exception:
                  print("Unable to seal workflow inputs.", file=sys.stderr)
                  return 1
              print("Sealed 19 entries.")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: environment-secret-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/environment-secrets.json
          if-no-files-found: error
          retention-days: 1
