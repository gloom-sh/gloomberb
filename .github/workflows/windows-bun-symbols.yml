name: Name addresses in Bun 1.3.13 baseline and Arm ntdll

on:
  push:
    branches:
      - chore/windows-arm-repro
    paths:
      - .github/workflows/windows-bun-symbols.yml

permissions:
  contents: read

jobs:
  symbols:
    runs-on: windows-latest
    steps:
      - name: Name the fault offset
        shell: pwsh
        run: |
          $Dir = Join-Path $env:RUNNER_TEMP "bunsym"
          Invoke-WebRequest "https://github.com/oven-sh/bun/releases/download/bun-v1.3.13/bun-windows-x64-baseline-profile.zip" -OutFile "$Dir.zip"
          Expand-Archive "$Dir.zip" -DestinationPath $Dir
          $Bin = Join-Path $Dir "bun-windows-x64-baseline-profile"
          $Cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          $Commands = @(
            ".reload /f", "lmv m bun_profile",
            "ln bun_profile+0x3282dd", "u bun_profile+0x3282dd-0x40 L28", "uf /c bun_profile+0x3282dd",
            "ln bun_profile+0x4dca1f", "ln bun_profile+0x6a7d3a", "ln bun_profile+0x6a78da",
            "q"
          ) -join "; "
          & $Cdb -z (Join-Path $Bin "bun-profile.exe") -y $Bin -c $Commands 2>&1 | Select-Object -Last 220

  ntdll:
    runs-on: windows-11-arm
    steps:
      - name: Name the ntdll fault and its caller
        shell: pwsh
        run: |
          $Cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64\cdb.exe"
          $Sym = "srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols"
          (Get-Item C:\Windows\System32\ntdll.dll).VersionInfo | Format-List FileVersion, ProductVersion
          $Commands = @(
            ".reload /f", "lm m ntdll",
            "ln ntdll+0x18c580", "u ntdll+0x18c580-0x30 L24",
            "ln ntdll+0x23e630", "u ntdll+0x23e630-0x10 L8",
            "q"
          ) -join "; "
          & $Cdb -z C:\Windows\System32\ntdll.dll -y $Sym -c $Commands 2>&1 | Select-Object -Last 80
          $Commands = @(".reload /f", "lm m xtajit64se", "ln xtajit64se+0x1bf0e0", "q") -join "; "
          & $Cdb -z C:\Windows\System32\xtajit64se.dll -y $Sym -c $Commands 2>&1 | Select-Object -Last 12
