name: UI tokens

# Holds every view of the desktop and web app to the design system's tokens
# (scripts/pane-chrome/ui-tokens.ts, docs/pane-conventions.md "Holding the
# line"): every function, the bundled plugins' panes and the registry's, with
# their details and tabs, docked at 640 and 1280 px on the real web build. A
# text's size or weight, a kit element's corner radius or a pane body's left
# inset off the tokens fails, unless src/architecture/ui-tokens-allowlist.json
# covers it with a why. The literals in the code are held by
# src/architecture/ui-literals.test.ts in Verify.
#
# Stable: the page reads Gloom Cloud only from a snapshot kept in the Actions
# cache, offline, so a pull request is measured on the same data every time;
# with no snapshot every pane draws its offline state, measured the same way.
# The registry's plugins build at the commits pinned with the snapshot
# (scripts/pane-chrome/plugin-lock.ts), so a plugin author's push reaches the
# check only with the next snapshot, and a value off the tokens in a registry
# plugin's view fails only when the snapshot's recording did not have it (the
# change under check made it); the plugin's own values are warnings. Main
# records the week's snapshot when it has none: every view once live, then
# checked from what it kept, as pull requests read it.
#
# Two shards (each driving two concurrent headless browsers offline), split by a
# hash of each function's token, then one job, "UI tokens", that passes only
# when every shard did: branch protection requires that one name, not the
# shards'. Two shards halve runner-slot demand under the organisation's
# concurrent job limit while keeping four parallel browsers total.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tokens-${{ github.ref }}
  cancel-in-progress: true

env:
  GLOOMBERB_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  scope:
    name: UI tokens scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - id: always
        if: github.event_name != 'pull_request'
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: scope
        name: Check whether the change can affect web or desktop UI tokens
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_REF"
          node -e '
            const { execFileSync } = require("node:child_process");
            const { appendFileSync } = require("node:fs");
            const files = execFileSync("git", ["diff", "--name-only", "FETCH_HEAD", "HEAD"], { encoding: "utf8" })
              .split("\n")
              .filter(Boolean);
            const nonUi = [
              /^docs\//,
              /\.md$/,
              /^src\/cli\//,
              /^src\/data\//,
              /^src\/sync\//,
              /^src\/renderers\/opentui\//,
              /^src\/renderers\/electrobun\/bun\//,
              /\.test\.tsx?$/,
              /^scripts\/(?!build-web\.ts$|pane-chrome\/)/,
              /^\.github\/(?!workflows\/ui-tokens\.yml$|actions\/setup-bun\/)/,
            ];
            const relevant = files.length === 0 || files.some((f) => !nonUi.some((re) => re.test(f)));
            console.log(relevant ? `UI tokens relevant (${files.length} changed files)` : `All ${files.length} changed files are outside web/desktop UI; skipping shards.`);
            appendFileSync(process.env.GITHUB_OUTPUT, `relevant=${relevant}\n`);
          '

  shard:
    name: UI tokens, shard ${{ matrix.shard }} of 2
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # Recording on main opens every view live, then again offline.
    timeout-minutes: ${{ github.ref == 'refs/heads/main' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - id: keys
        name: Read the pinned Chrome version and this week
        run: |
          echo "chrome=$(sed -n 's/^const CHROME_VERSION = "\(.*\)";$/\1/p' scripts/pane-chrome/browser.ts)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/gloomberb-pane-chrome/chrome-headless-shell-${{ steps.keys.outputs.chrome }}
          key: chrome-headless-shell-${{ steps.keys.outputs.chrome }}-${{ runner.os }}-${{ runner.arch }}

      # Checkouts of the registry's plugins; which commit each builds is the snapshot's lock.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/gloomberb-pane-chrome/ui-audit-plugins
          key: ui-audit-plugins-${{ steps.keys.outputs.week }}
          restore-keys: ui-audit-plugins-

      # Main takes only this week's snapshot and records it when it is missing;
      # a pull request takes the newest kept.
      - id: snapshot
        name: Restore the data snapshot
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/gloomberb-pane-chrome/ui-replay
          key: ui-replay-v2-${{ matrix.shard }}of2-${{ steps.keys.outputs.week }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('ui-replay-v2-{0}of2-', matrix.shard) || '' }}

      - name: Hold every view to the tokens
        env:
          SHARD: ${{ matrix.shard }}
          RECORD: ${{ github.ref == 'refs/heads/main' && steps.snapshot.outputs.cache-hit != 'true' && '--record' || '' }}
        run: bun run check:ui-tokens --shard "$((SHARD - 1))/2" --replay "$HOME/.cache/gloomberb-pane-chrome/ui-replay" $RECORD

      - name: Keep this week's snapshot
        if: github.ref == 'refs/heads/main' && steps.snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/gloomberb-pane-chrome/ui-replay
          key: ui-replay-v2-${{ matrix.shard }}of2-${{ steps.keys.outputs.week }}

      - name: Keep the measures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-tokens-${{ matrix.shard }}
          path: |
            ~/.cache/gloomberb-pane-chrome/ui-tokens/results.jsonl
            ~/.cache/gloomberb-pane-chrome/ui-tokens/views.jsonl
          if-no-files-found: ignore

  verdict:
    name: UI tokens
    needs:
      - scope
      - shard
    # always(), not the default: a required check that is skipped counts as
    # passed, so this runs, and fails, when a shard failed or was cancelled.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RELEVANT: ${{ needs.scope.outputs.relevant }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "Scope: $SCOPE_RESULT (relevant=$RELEVANT); shards: $SHARDS"
          test "$SCOPE_RESULT" = success
          if [ "$RELEVANT" = false ]; then
            echo "No UI files changed; skipped 2 shards."
            exit 0
          fi
          test "$SHARDS" = success
