name: UI tokens

# Holds every view of the desktop and web app to the design system's tokens
# (scripts/pane-chrome/ui-tokens.ts, docs/pane-conventions.md "Holding the
# line"): every function, the bundled plugins' panes and the registry's, with
# their details and tabs, docked at 640 and 1280 px on the real web build. A
# text's size or weight, a kit element's corner radius or a pane body's left
# inset off the tokens fails, unless src/architecture/ui-tokens-allowlist.json
# covers it with a why. The literals in the code are held by
# src/architecture/ui-literals.test.ts in Verify.
#
# Stable: the page reads Gloom Cloud only from a snapshot kept in the Actions
# cache, offline, so a pull request is measured on the same data every time;
# with no snapshot every pane draws its offline state, measured the same way.
# The registry's plugins build at the commits pinned with the snapshot
# (scripts/pane-chrome/plugin-lock.ts), so a plugin author's push reaches the
# check only with the next snapshot, and a value off the tokens in a registry
# plugin's view fails only when the snapshot's recording did not have it (the
# change under check made it); the plugin's own values are warnings. Main
# records the week's snapshot when it has none: every view once live, then
# checked from what it kept, as pull requests read it.
#
# Four shards, split by a hash of each function's token, then one job, "UI
# tokens", that passes only when every shard did: branch protection requires
# that one name, not the shards'. Four leave room under the organisation's
# concurrent jobs for Verify, Pane chrome and Performance beside them.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tokens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: UI tokens, shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    # Recording on main opens every view live, then again offline.
    timeout-minutes: ${{ github.ref == 'refs/heads/main' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - id: keys
        name: Read the pinned Chrome version and this week
        run: |
          echo "chrome=$(sed -n 's/^const CHROME_VERSION = "\(.*\)";$/\1/p' scripts/pane-chrome/browser.ts)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/gloomberb-pane-chrome/chrome-headless-shell-${{ steps.keys.outputs.chrome }}
          key: chrome-headless-shell-${{ steps.keys.outputs.chrome }}-${{ runner.os }}-${{ runner.arch }}

      # Checkouts of the registry's plugins; which commit each builds is the snapshot's lock.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gloomberb-pane-chrome/ui-audit-plugins
          key: ui-audit-plugins-${{ steps.keys.outputs.week }}
          restore-keys: ui-audit-plugins-

      # Main takes only this week's snapshot and records it when it is missing;
      # a pull request takes the newest kept.
      - id: snapshot
        name: Restore the data snapshot
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/gloomberb-pane-chrome/ui-replay
          key: ui-replay-v2-${{ matrix.shard }}of4-${{ steps.keys.outputs.week }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('ui-replay-v2-{0}of4-', matrix.shard) || '' }}

      - name: Hold every view to the tokens
        env:
          SHARD: ${{ matrix.shard }}
          RECORD: ${{ github.ref == 'refs/heads/main' && steps.snapshot.outputs.cache-hit != 'true' && '--record' || '' }}
        run: bun run check:ui-tokens --shard "$((SHARD - 1))/4" --replay "$HOME/.cache/gloomberb-pane-chrome/ui-replay" $RECORD

      - name: Keep this week's snapshot
        if: github.ref == 'refs/heads/main' && steps.snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/gloomberb-pane-chrome/ui-replay
          key: ui-replay-v2-${{ matrix.shard }}of4-${{ steps.keys.outputs.week }}

      - name: Keep the measures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tokens-${{ matrix.shard }}
          path: |
            ~/.cache/gloomberb-pane-chrome/ui-tokens/results.jsonl
            ~/.cache/gloomberb-pane-chrome/ui-tokens/views.jsonl
          if-no-files-found: ignore

  verdict:
    name: UI tokens
    needs: shard
    # always(), not the default: a required check that is skipped counts as
    # passed, so this runs, and fails, when a shard failed or was cancelled.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "The shards: $SHARDS"
          test "$SHARDS" = success
