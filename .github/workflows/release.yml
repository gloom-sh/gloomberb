name: Release

on:
  push:
    tags:
      - "v*"
      # Nightly prereleases tag themselves through the GitHub API, which starts
      # no workflow, but a nightly tag pushed by hand must not publish to npm
      # or Homebrew either.
      - "!v*-nightly.*"
  # Publishes @gloom-sh/terminal for a tag that already has a release, when
  # that step failed or was skipped. It runs only the publish-terminal job:
  # no build, no asset upload, no Homebrew, no website refresh. It lives in
  # this file because npm trusted publishing is bound to it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish as @gloom-sh/terminal, e.g. v0.19.0"
        required: true
        type: string

# Write access only where something is published.
permissions:
  contents: read

jobs:
  # The terminal binaries, the signed macOS desktop app and the Windows
  # desktop installer, shared with the Nightly workflow.
  build:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/build-release-assets.yml
    secrets:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
      ELECTROBUN_APPLEAPIKEY_BASE64: ${{ secrets.ELECTROBUN_APPLEAPIKEY_BASE64 }}
      ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
      ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}

  # Every plugin the registry lists has to load in what was built, in a job
  # with no secrets. A host that does not serve what plugins import holds the
  # release back; a registry or plugin outage only warns.
  registry-plugins:
    needs:
      - build
    if: ${{ github.event_name == 'push' && always() && !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/load-registry-plugins.yml
    with:
      all-built: ${{ needs.build.result == 'success' }}

  release:
    environment: release
    needs:
      - build
      - registry-plugins
    if: ${{ github.event_name == 'push' && always() && !cancelled() && needs.registry-plugins.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      # The upload below publishes the draft, so every file the builds make
      # has to be here first: each terminal binary of the build matrix and the
      # desktop files. A build that uploaded nothing fails this step, by name,
      # with nothing uploaded and the draft still a draft; `gh run rerun
      # --failed` builds it again, runs this job again, and that publishes it.
      - name: Check every release file was built
        run: bun scripts/release-assets.ts check dist

      # Each file is the one the build uploaded, and there is no other: the
      # plugin check ran after the build and could reach the artifacts.
      - name: Check the files are the ones built
        env:
          BUILT_SHA256: ${{ needs.registry-plugins.outputs.built-sha256 }}
        run: bash scripts/check-built-files.sh dist

      # install.sh and install.ps1 read each asset's SHA-256 from
      # `<asset>.sha256` beside it, by its download URL (the API's digests are
      # rate limited), and install nothing without it.
      - name: Write checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in *.dmg *.exe *.gz *.json *.zip *.zst; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Upload assets to GitHub release
        id: upload
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.gz
            dist/*.json
            dist/*.zip
            dist/*.zst
            dist/*.sha256

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_PATH="dist/stable-macos-arm64-Gloom.app.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "macOS desktop zip is missing; skipping Homebrew tap update."
            exit 0
          fi
          SHA256="$(sha256sum "$ZIP_PATH" | awk '{print $1}')"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"

          git config --global user.name "gloomberb-release"
          git config --global user.email "actions@users.noreply.github.com"
          gh repo clone vincelwt/homebrew-tap "$TAP_DIR"
          git -C "$TAP_DIR" remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/vincelwt/homebrew-tap.git"
          bun run scripts/write-homebrew-cask.ts \
            --version "$VERSION" \
            --sha256 "$SHA256" \
            --output "$TAP_DIR/Casks/gloomberb.rb"

          cd "$TAP_DIR"
          git add Casks/gloomberb.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap already up to date."
            exit 0
          fi
          git commit -m "Update Gloom to $VERSION"
          git push

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm 11 (required for trusted publishing)
        run: npm install -g npm@11.21.2

      - name: Publish to npm
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [ "v$PACKAGE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "package.json is at $PACKAGE_VERSION but the tag is $GITHUB_REF_NAME; tag the commit bump-version.sh made." >&2
            exit 1
          fi
          if npm view "gloomberb@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "gloomberb@$PACKAGE_VERSION is already on npm."
            exit 0
          fi
          npm publish --access public --provenance

      # The same build under a second name, @gloom-sh/terminal, once the
      # repository variable PUBLISH_GLOOM_TERMINAL is "true". It installs the
      # same gloom and gloomberb commands. A version already there is skipped,
      # so a rerun of the release does not fail on it, and a publish that
      # fails without the version appearing (the provenance log answers 409
      # now and then) is tried once more.
      - name: Publish to npm as @gloom-sh/terminal
        if: ${{ vars.PUBLISH_GLOOM_TERMINAL == 'true' }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "@gloom-sh/terminal@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "@gloom-sh/terminal@$PACKAGE_VERSION is already on npm."
            exit 0
          fi
          npm pkg set "name=@gloom-sh/terminal"
          if ! npm publish --access public --provenance; then
            sleep 30
            if npm view "@gloom-sh/terminal@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              echo "@gloom-sh/terminal@$PACKAGE_VERSION is on npm after the failed publish."
              exit 0
            fi
            echo "Publish failed and @gloom-sh/terminal@$PACKAGE_VERSION is not on npm; trying once more."
            npm publish --access public --provenance
          fi
          git checkout -- package.json

      - name: Note the skipped @gloom-sh/terminal publish
        if: ${{ vars.PUBLISH_GLOOM_TERMINAL != 'true' }}
        run: |
          echo "::notice title=npm::Published as gloomberb only. Set the repository variable PUBLISH_GLOOM_TERMINAL to true to publish releases as @gloom-sh/terminal too."

      # The website re-captures its function screenshots against this release
      # and opens a PR there when a pane's layout changed, once the release is
      # published, even when a publish to npm failed. The repository variable
      # PLATFORM_DISPATCH_REPO names its repository (owner/name).
      - name: Ask the website to refresh screenshots
        if: ${{ always() && steps.upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          DISPATCH_REPO: ${{ vars.PLATFORM_DISPATCH_REPO }}
        run: |
          if [ -z "${DISPATCH_REPO:-}" ]; then
            echo "::notice title=Screenshots::PLATFORM_DISPATCH_REPO is not set; skipping screenshot refresh."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PLATFORM_DISPATCH_TOKEN is not configured; skipping screenshot refresh."
            exit 0
          fi
          gh api "repos/${DISPATCH_REPO}/dispatches" \
            -f event_type=gloomberb-release \
            -f "client_payload[ref]=${GITHUB_REF_NAME}"

  # Workflow dispatch only: publishes @gloom-sh/terminal for an existing tag,
  # the same way the release job does after a push, with nothing else.
  publish-terminal:
    environment: release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The same tags the push trigger accepts: v*, never a nightly.
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "Dispatch this workflow at the matching tag with --ref $TAG -f tag=$TAG." >&2
            exit 1
          fi
          case "$TAG" in
            v[0-9]*-nightly.*) echo "$TAG is a nightly tag; nightlies are not published to npm." >&2; exit 1 ;;
            v[0-9]*) ;;
            *) echo "$TAG is not a release tag like v0.19.0." >&2; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Check package.json matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [ "v$PACKAGE_VERSION" != "$TAG" ]; then
            echo "package.json is at $PACKAGE_VERSION but the tag is $TAG; pass the tag bump-version.sh made." >&2
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm 11 (required for trusted publishing)
        run: npm install -g npm@11.21.2

      - name: Publish to npm as @gloom-sh/terminal
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "@gloom-sh/terminal@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "@gloom-sh/terminal@$PACKAGE_VERSION is already on npm."
            exit 0
          fi
          npm pkg set "name=@gloom-sh/terminal"
          if ! npm publish --access public --provenance; then
            sleep 30
            if npm view "@gloom-sh/terminal@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              echo "@gloom-sh/terminal@$PACKAGE_VERSION is on npm after the failed publish."
              exit 0
            fi
            echo "Publish failed and @gloom-sh/terminal@$PACKAGE_VERSION is not on npm; trying once more."
            npm publish --access public --provenance
          fi
