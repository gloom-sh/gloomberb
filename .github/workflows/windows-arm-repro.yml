name: Windows on Arm launch repro

on:
  push:
    branches:
      - chore/windows-arm-repro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stays-up:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Open v0.19.1 with Windows Error Reporting on
        shell: pwsh
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP "GloomSetup-v0.19.1.exe"
          Invoke-WebRequest "https://github.com/gloom-sh/gloomberb/releases/download/v0.19.1/stable-win-x64-GloomSetup.exe" -OutFile $Installer
          $Cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64\cdb.exe"
          $Failed = @()
          foreach ($Launch in 1, 2, 3) {
            $Label = "w${{ matrix.attempt }}-$Launch"
            try {
              ./scripts/verify-windows-stays-up.ps1 -Installer $Installer -Label $Label -Seconds 40
            } catch {
              $Failed += "${Label}: $($_.Exception.Message)"
            }
            foreach ($Dump in (Get-ChildItem "artifacts/windows-stays-up/$Label/dumps" -Filter *.dmp -ErrorAction SilentlyContinue)) {
              $Stacks = Join-Path $Dump.DirectoryName "$($Dump.BaseName).stacks.txt"
              & $Cdb -z $Dump.FullName -c ".symfix; .reload; .effmach; .lastevent; .exr -1; .ecxr; r; kn 40; .effmach amd64; kn 40; lmv m bun; lmv m libNativeWrapper; lmv m libcef; ~*kn 12; q" 2>&1 | Out-File $Stacks
              Write-Host "$($Dump.Name): $($Dump.Length) bytes"
              Get-Content $Stacks | Select-String -Pattern "Last event|ExceptionCode|ExceptionAddress|Attempt to|^0[0-9] " | Select-Object -First 40 | ForEach-Object { Write-Host "  $_" }
              Remove-Item -LiteralPath $Dump.FullName
            }
          }
          if ($Failed.Count -gt 0) { throw ($Failed -join "; ") }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wer-${{ matrix.attempt }}
          path: |
            artifacts/windows-stays-up/**/stays-up.txt
            artifacts/windows-stays-up/**/dumps/*.txt
