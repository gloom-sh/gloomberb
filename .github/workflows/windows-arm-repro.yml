name: Windows on Arm launch repro

on:
  push:
    branches:
      - chore/windows-arm-repro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Build Windows desktop package
        shell: pwsh
        run: ./scripts/build-windows-desktop-package.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: diag-installer
          path: artifacts/stable-win-x64-GloomSetup.exe

  stays-up:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        variant: [as-is, no-icon, no-frame, neither]
        attempt: [1, 2]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: diag-installer
          path: installer

      - name: Open the diagnostic build twice
        shell: pwsh
        run: |
          $Variant = "${{ matrix.variant }}"
          if ($Variant -in @("no-icon", "neither")) { $env:GLOOM_DIAG_NO_ICON = "1" }
          if ($Variant -in @("no-frame", "neither")) { $env:GLOOM_DIAG_NO_CHROME = "1" }
          $Failed = @()
          foreach ($Launch in 1, 2) {
            $Label = "$Variant-${{ matrix.attempt }}-$Launch"
            $Trace = Join-Path $env:LOCALAPPDATA "gloom-diag-trace.log"
            Remove-Item -LiteralPath $Trace -ErrorAction SilentlyContinue
            try {
              ./scripts/verify-windows-stays-up.ps1 -Installer installer/stable-win-x64-GloomSetup.exe -Label $Label -Seconds 40 -Console
            } catch {
              $Failed += "${Label}: $($_.Exception.Message)"
            }
            Copy-Item -LiteralPath $Trace -Destination "artifacts/windows-stays-up/$Label/trace.log" -ErrorAction SilentlyContinue
          }
          if ($Failed.Count -gt 0) { throw ($Failed -join "; ") }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stays-up-${{ matrix.variant }}-${{ matrix.attempt }}
          path: artifacts/windows-stays-up
