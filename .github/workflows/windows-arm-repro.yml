name: Windows on Arm launch repro

on:
  push:
    branches:
      - chore/windows-arm-repro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stays-up:
    strategy:
      fail-fast: false
      matrix:
        variant: [control, no-jit, chromium-watchers, no-gpu]
        attempt: [1, 2]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Open v0.19.1 twice
        shell: pwsh
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP "GloomSetup-v0.19.1.exe"
          Invoke-WebRequest "https://github.com/gloom-sh/gloomberb/releases/download/v0.19.1/stable-win-x64-GloomSetup.exe" -OutFile $Installer
          $Flags = ""
          switch ("${{ matrix.variant }}") {
            "no-jit" { $env:BUN_JSC_useJIT = "0" }
            "chromium-watchers" { $Flags = "disable-features=VizDisplayCompositor,EnableHangWatcher;disable-stack-profiler" }
            "no-gpu" { $Flags = "disable-gpu;disable-gpu-compositing" }
          }
          $Failed = @()
          foreach ($Launch in 1, 2) {
            $Label = "${{ matrix.variant }}-${{ matrix.attempt }}-$Launch"
            try {
              ./scripts/verify-windows-stays-up.ps1 -Installer $Installer -Label $Label -Seconds 45 -AddChromiumFlag $Flags
            } catch {
              $Failed += "${Label}: $($_.Exception.Message)"
            }
          }
          if ($Failed.Count -gt 0) { throw ($Failed -join "; ") }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stays-up-${{ matrix.variant }}-${{ matrix.attempt }}
          path: |
            artifacts/windows-stays-up/**/*.txt
            artifacts/windows-stays-up/**/*.log
