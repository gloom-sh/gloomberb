name: Windows on Arm launch repro

on:
  push:
    branches:
      - chore/windows-arm-repro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stays-up:
    strategy:
      fail-fast: false
      matrix:
        tag:
          - v0.18.5
          - v0.18.6-nightly.20261026.16.g28bcbdf
          - v0.18.6-nightly.20261027.17.g0581716
          - v0.18.6-nightly.20261028.18.gf453cea
          - v0.19.0
          - v0.19.1
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install and open the release
        shell: pwsh
        run: |
          $Tag = "${{ matrix.tag }}"
          $Asset = if ($Tag -like "*-nightly.*") { "nightly-win-x64-GloomSetup.exe" } else { "stable-win-x64-GloomSetup.exe" }
          $Installer = Join-Path $env:RUNNER_TEMP "GloomSetup-$Tag.exe"
          Invoke-WebRequest "https://github.com/gloom-sh/gloomberb/releases/download/$Tag/$Asset" -OutFile $Installer
          ./scripts/verify-windows-stays-up.ps1 -Installer $Installer -Label $Tag -Seconds 60 -Console

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stays-up-${{ matrix.tag }}
          path: artifacts/windows-stays-up
