name: Windows on Arm launch repro

on:
  workflow_dispatch:
    inputs:
      installer_run:
        description: A Verify Windows run whose installer to open (empty for the v0.19.1 release)
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  recorder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the exception recorder
        shell: cmd
        run: cl /nologo /O2 /LD /MT scripts\diag-veh\veh.c /Fe:veh.dll /link kernel32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: veh-dll
          path: veh.dll

  stays-up:
    needs: recorder
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veh-dll
          path: veh
      - uses: actions/download-artifact@v4
        if: inputs.installer_run != ''
        with:
          name: windows-x64-installer
          path: installer
          run-id: ${{ inputs.installer_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open v0.19.1 with the exception recorder loaded first
        shell: pwsh
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP "GloomSetup-v0.19.1.exe"
          if ("${{ inputs.installer_run }}") {
            $Installer = (Resolve-Path installer/stable-win-x64-GloomSetup.exe).Path
          } else {
            Invoke-WebRequest "https://github.com/gloom-sh/gloomberb/releases/download/v0.19.1/stable-win-x64-GloomSetup.exe" -OutFile $Installer
          }
          $env:GLOOM_DIAG_VEH_DLL = (Resolve-Path veh/veh.dll).Path
          $Prelude = 'try { import.meta.require("bun:ffi").dlopen(process.env.GLOOM_DIAG_VEH_DLL, { veh_installed: { args: [], returns: "i32" } }).symbols.veh_installed(); } catch (e) { console.error("veh", e); }'
          $Failed = @()
          foreach ($Launch in 1, 2, 3) {
            $Label = "v${{ matrix.attempt }}-$Launch"
            New-Item -ItemType Directory -Force -Path "artifacts/windows-stays-up/$Label" | Out-Null
            $env:GLOOM_DIAG_VEH_LOG = Join-Path (Get-Location) "artifacts/windows-stays-up/$Label/exceptions.txt"
            try {
              ./scripts/verify-windows-stays-up.ps1 -Installer $Installer -Label $Label -Seconds 40 -Prelude $Prelude -Console
            } catch {
              $Failed += "${Label}: $($_.Exception.Message)"
            }
            if (Test-Path $env:GLOOM_DIAG_VEH_LOG) {
              Write-Host "---- $Label exceptions"
              Get-Content $env:GLOOM_DIAG_VEH_LOG | Where-Object { $_ -notmatch "^module " -or $_ -match "bun\.exe|libNativeWrapper|libcef|ntdll|KERNELBASE|xtajit" } | Select-Object -First 120 | ForEach-Object { Write-Host "  $_" }
            } else {
              Write-Host "---- $Label no exception log"
            }
          }
          if ($Failed.Count -gt 0) { throw ($Failed -join "; ") }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veh-${{ matrix.attempt }}
          path: |
            artifacts/windows-stays-up/**/stays-up.txt
            artifacts/windows-stays-up/**/exceptions.txt
