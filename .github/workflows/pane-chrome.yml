name: Pane chrome

# Moves panes with real pointer input in headless Chrome (scripts/pane-chrome),
# and checks that a pane's Copy Screenshot image shows its charts.
# Only for changes that can break pane chrome: the shell and pane headers,
# the dock, the DOM renderer, the desktop view, the pane screenshot, the
# charts and heat maps that follow a resize, the keys held down (one-shot
# shortcuts run once, arrows repeat), the chat message list, where text and
# scrolled content stop against a pane's footer and edge (the detail and
# article readers, markdown, prose, tables set inline, label and value rows,
# charts sized in rows, the Trials and Changelog panes), the app's top bar in
# every update state, and these checks themselves.
# The pane drag frame budget is in the Performance workflow and runs for the
# same pull_request paths (scripts/pane-chrome/scope.ts reads them from here).
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths: &pane-chrome-paths
      - "src/components/layout/**"
      - "src/components/command-bar/**"
      - "src/app/keybindings/**"
      - "src/shares/**"
      - "src/plugins/builtin/chat/share/**"
      - "src/plugins/builtin/chat/index.tsx"
      - "src/plugins/builtin/chart-composer/pane.tsx"
      - "src/plugins/builtin/news/wire/news/footer.ts"
      - "src/components/chart/composite/**"
      - "src/components/chart/native/raster/**"
      - "src/time-series/resolve.ts"
      - "src/time-series/use-chart-resolution.ts"
      - "src/time-series/parsed-history-cache.ts"
      - "src/components/metric-treemap/**"
      - "src/components/ui/tabs.tsx"
      - "src/components/ui/icon.tsx"
      - "src/components/ui/column-grid.tsx"
      - "src/components/ui/range-track.tsx"
      - "src/components/price-performance.tsx"
      - "src/components/ui/data-table/**"
      - "src/components/ui/detail-scroll-body.tsx"
      - "src/components/ui/prose.tsx"
      - "src/components/ui/display.tsx"
      - "src/components/ui/fill.ts"
      - "src/plugins/builtin/shared/series-list-detail.tsx"
      - "src/components/table-view-shared.tsx"
      - "src/components/reader/**"
      - "src/components/markdown-text.tsx"
      - "src/components/feed-data-table/**"
      - "src/plugins/builtin/clinical-trials/**"
      - "src/plugins/builtin/changelog/**"
      - "src/components/data-table/**"
      - "src/layout/**"
      - "src/plugins/builtin/chat/**"
      - "src/plugins/builtin/ticker-detail/overview-tab.tsx"
      - "src/plugins/builtin/ticker-detail/overview/**"
      - "src/react/input.ts"
      - "src/react/key-repeat.ts"
      - "src/ui/**"
      - "src/renderers/dom/**"
      - "src/renderers/electrobun/view/**"
      - "src/state/app/**"
      - "src/core/state/app/**"
      - "src/theme/font-scale.ts"
      - "src/utils/dom-screenshot*.ts"
      - "src/utils/one-shot.ts"
      - "src/utils/double-escape-close.ts"
      - "src/utils/datetime-format.ts"
      - "src/utils/screenshot-watermark.ts"
      - "src/remote/pane-screenshot.ts"
      - "src/types/config.ts"
      - "src/types/desktop-window.ts"
      - "scripts/pane-chrome/**"
      - "scripts/tui-benchmark-harness.ts"
      - ".github/workflows/pane-chrome.yml"
      - "package.json"
      - "bun.lock"
  push:
    branches:
      - main
    paths: *pane-chrome-paths

permissions:
  contents: read

concurrency:
  group: pane-chrome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pointer-checks:
    name: Pointer checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - id: chrome
        name: Read the pinned Chrome version
        run: echo "version=$(sed -n 's/^const CHROME_VERSION = "\(.*\)";$/\1/p' scripts/pane-chrome/browser.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/gloomberb-pane-chrome/chrome-headless-shell-${{ steps.chrome.outputs.version }}
          key: chrome-headless-shell-${{ steps.chrome.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      # Fails when a pane stops moving from its grip, title or bare header bar
      # (docked, tabbed, failed, floating, fullscreen, popped out), when tabs
      # stop selecting or reordering or start moving their pane, or when the
      # resize corner or edges, a dock divider or a sidebar divider stop
      # working or stop following the pointer during the drag, or when an
      # item of the app's top bar paints over another or is cut at some
      # window width. The summary names the step.
      - name: Move panes with real pointer input
        run: bun run check:pane-chrome

      - name: Bound opening mounts and keep draft and upload work off message rows
        run: bun scripts/pane-chrome/chat-latency.ts --quick --check --label chat-latency

      - name: Complete mentions from cached channel members
        run: |
          mkdir -p ~/.cache
          flock ~/.cache/gloom-announce-render.lock nice -n19 bun run check:chat-mentions

      - name: Show chat after mount and asynchronous channel transitions
        run: bun scripts/pane-chrome/chat-latency.ts --lifecycle --multiple --quick --check --label chat-lifecycle

      - name: Keep chat input profiles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chat-latency
          path: |
            ~/.cache/gloomberb-pane-chrome/chat-latency
            ~/.cache/gloomberb-pane-chrome/chat-lifecycle
          if-no-files-found: ignore

      - name: Keep screenshots of failed steps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pane-chrome-failures
          path: ~/.cache/gloomberb-pane-chrome/failures
          if-no-files-found: ignore

  chat-webkit:
    name: Chat painting in WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun

      - name: Install the pinned WebKit build and system libraries
        run: bun node_modules/playwright-core/cli.js install --with-deps webkit

      - name: Paint chat through mount and channel transitions in three panes
        run: |
          mkdir -p ~/.cache
          flock ~/.cache/gloom-announce-render.lock nice -n19 bun scripts/pane-chrome/chat-latency.ts --webkit --lifecycle --multiple --arrival-on-mount --quick --repeat 3 --check --label chat-webkit

      - name: Paint chat through the detached shell
        run: flock ~/.cache/gloom-announce-render.lock nice -n19 bun scripts/pane-chrome/chat-latency.ts --webkit --lifecycle --detached --arrival-on-mount --quick --repeat 3 --check --label chat-webkit-detached

      - name: Paint cold and warm channel opens
        run: flock ~/.cache/gloom-announce-render.lock nice -n19 bun scripts/pane-chrome/chat-latency.ts --webkit --open-only --quick --check --label chat-webkit-open

      - name: Keep chat paint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-webkit
          path: |
            ~/.cache/gloomberb-pane-chrome/chat-webkit/samples.json
            ~/.cache/gloomberb-pane-chrome/chat-webkit/*.png
            ~/.cache/gloomberb-pane-chrome/chat-webkit-detached/samples.json
            ~/.cache/gloomberb-pane-chrome/chat-webkit-detached/*.png
            ~/.cache/gloomberb-pane-chrome/chat-webkit-open/samples.json
            ~/.cache/gloomberb-pane-chrome/chat-webkit-open/*.png
          if-no-files-found: ignore

  copy-screenshot:
    name: Copy screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - id: chrome
        name: Read the pinned Chrome version
        run: echo "version=$(sed -n 's/^const CHROME_VERSION = "\(.*\)";$/\1/p' scripts/pane-chrome/browser.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/gloomberb-pane-chrome/chrome-headless-shell-${{ steps.chrome.outputs.version }}
          key: chrome-headless-shell-${{ steps.chrome.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      # Fails when a pane's Copy Screenshot image is missing what the screen
      # shows in a chart region: an SVG gauge or chart, a canvas chart, or a
      # CSS gradient or masked icon (GLO-493). The summary has the numbers.
      - name: Compare pane copies with the screen
        run: bun run check:pane-screenshot

      - name: Keep the images of failed panes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pane-screenshot-failures
          path: ~/.cache/gloomberb-pane-chrome/failures
          if-no-files-found: ignore
