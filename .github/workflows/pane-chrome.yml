name: Pane chrome

# Moves panes with real pointer input in headless Chrome (scripts/pane-chrome),
# and checks that a pane's Copy Screenshot image shows its charts.
# Only for changes that can break pane chrome: the shell and pane headers,
# the dock, the DOM renderer, the desktop view, the pane screenshot, the
# charts and heat maps that follow a resize, the keys held down (one-shot
# shortcuts run once, arrows repeat), the chat message list, where text and
# scrolled content stop against a pane's footer and edge (the detail and
# article readers, markdown, prose, tables set inline, label and value rows,
# charts sized in rows, the Trials and Changelog panes), the app's top bar in
# every update state, the query bar at every width, and these checks themselves.
# The pane drag frame budget is in the Performance workflow and runs for the
# same pull_request paths (scripts/pane-chrome/scope.ts reads them from here).
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths: &pane-chrome-paths
      - "src/components/layout/**"
      - "src/components/command-bar/**"
      - "src/app/keybindings/**"
      - "src/shares/**"
      - "src/plugins/builtin/chat/share/**"
      - "src/plugins/builtin/chat/index.tsx"
      - "src/plugins/builtin/chart-composer/pane.tsx"
      - "src/plugins/builtin/news/wire/news/footer.ts"
      - "src/components/chart/composite/**"
      - "src/components/chart/native/raster/**"
      - "src/time-series/resolve.ts"
      - "src/time-series/resolve-context.ts"
      - "src/time-series/chart-bounds.ts"
      - "src/time-series/history-acquisition.ts"
      - "src/time-series/base-series.ts"
      - "src/time-series/series-presentation.ts"
      - "src/time-series/chart-seed.ts"
      - "src/time-series/tail-reconcile.ts"
      - "src/time-series/use-chart-resolution.ts"
      - "src/time-series/parsed-history-cache.ts"
      - "src/components/metric-treemap/**"
      - "src/components/ui/tabs.tsx"
      - "src/components/ui/query-bar.tsx"
      - "src/components/ui/icon.tsx"
      - "src/components/ui/column-grid.tsx"
      - "src/components/ui/range-track.tsx"
      - "src/components/price-performance.tsx"
      - "src/components/ui/data-table/**"
      - "src/components/ui/detail-scroll-body.tsx"
      - "src/components/ui/prose.tsx"
      - "src/components/ui/display.tsx"
      - "src/components/ui/fill.ts"
      - "src/plugins/builtin/shared/series-list-detail.tsx"
      - "src/components/table-view-shared.tsx"
      - "src/components/reader/**"
      - "src/components/markdown-text.tsx"
      - "src/components/feed-data-table/**"
      - "src/plugins/builtin/clinical-trials/**"
      - "src/plugins/builtin/changelog/**"
      - "src/components/data-table/**"
      - "src/layout/**"
      - "src/plugins/builtin/chat/**"
      - "src/plugins/builtin/ticker-detail/overview-tab.tsx"
      - "src/plugins/builtin/ticker-detail/overview/**"
      - "src/react/input.ts"
      - "src/react/key-repeat.ts"
      - "src/ui/**"
      - "src/renderers/dom/**"
      - "src/renderers/electrobun/view/**"
      - "src/state/app/**"
      - "src/core/state/app/**"
      - "src/theme/font-scale.ts"
      - "src/utils/dom-screenshot*.ts"
      - "src/utils/one-shot.ts"
      - "src/utils/double-escape-close.ts"
      - "src/utils/datetime-format.ts"
      - "src/utils/screenshot-watermark.ts"
      - "src/remote/pane-screenshot.ts"
      - "src/types/config.ts"
      - "src/types/desktop-window.ts"
      - "scripts/pane-chrome/**"
      - "scripts/tui-benchmark-harness.ts"
      - ".github/workflows/pane-chrome.yml"
      - ".github/actions/install-webkit/**"
      - "package.json"
      - "bun.lock"
  push:
    branches:
      - main
    paths: *pane-chrome-paths

permissions:
  contents: read

concurrency:
  group: pane-chrome-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  GLOOMBERB_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  scope:
    name: Pane chrome scope
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chat_checks: ${{ steps.scope.outputs.chat_checks }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - id: scope
        name: Check whether chat or shell layout paths changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "chat_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_REF"
          bun run scripts/pane-chrome/pane-chrome-scope.ts --base FETCH_HEAD

  pointer-checks:
    name: Pointer checks
    needs: scope
    if: github.event.action != 'closed' && needs.scope.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-bun

      - id: chrome
        name: Read the pinned Chrome version
        run: echo "version=$(sed -n 's/^const CHROME_VERSION = "\(.*\)";$/\1/p' scripts/pane-chrome/browser.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/gloomberb-pane-chrome/chrome-headless-shell-${{ steps.chrome.outputs.version }}
          key: chrome-headless-shell-${{ steps.chrome.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      # Fails when a pane stops moving from its grip, title or bare header bar
      # (docked, tabbed, failed, floating, fullscreen, popped out), when tabs
      # stop selecting or reordering or start moving their pane, or when the
      # resize corner or edges, a dock divider or a sidebar divider stop
      # working or stop following the pointer during the drag, when an
      # item of the app's top bar paints over another or is cut at some
      # window width, or when a title-bar tab stops being a box open into
      # its pane with its label on the title's centre line. The summary
      # names the step.
      - name: Move panes with real pointer input
        env:
          PANE_CHROME_CONCURRENCY: "3"
        run: bun run check:pane-chrome

      # Fails when a pane's Copy Screenshot image is missing what the screen
      # shows in a chart region: an SVG gauge or chart, a canvas chart, or a
      # CSS gradient or masked icon. The summary has the numbers.
      - name: Compare pane copies with the screen
        run: bun run check:pane-screenshot

      - name: Check chat mounts, mentions, lifecycle, and window return
        if: needs.scope.outputs.chat_checks == 'true'
        shell: bash
        run: |
          set -euo pipefail
          collect() {
            local status=0
            while [ $# -gt 0 ]; do
              local label="$1" pid="$2" log="$3"
              shift 3
              if ! wait "$pid"; then
                status=1
                echo "::error title=Pane chrome: ${label}::failed"
              fi
              echo "=== ${label} ==="
              cat "$log"
              rm -f "$log"
            done
            return "$status"
          }
          log1="$(mktemp)"; log2="$(mktemp)"; log3="$(mktemp)"
          bun scripts/pane-chrome/chat-latency.ts --quick --check --label chat-latency >"$log1" 2>&1 & p1=$!
          bun scripts/pane-chrome/chat-latency.ts --lifecycle --multiple --quick --check --label chat-lifecycle >"$log2" 2>&1 & p2=$!
          bun scripts/pane-chrome/chat-latency.ts --pane-return --quick --check --label chat-pane-return >"$log3" 2>&1 & p3=$!
          collect \
            "chat-latency" "$p1" "$log1" \
            "chat-lifecycle" "$p2" "$log2" \
            "chat-pane-return" "$p3" "$log3"

          log4="$(mktemp)"; log5="$(mktemp)"
          bun run check:chat-mentions >"$log4" 2>&1 & p4=$!
          bun scripts/pane-chrome/chat-latency.ts --layout-return --quick --check --label chat-layout-return >"$log5" 2>&1 & p5=$!
          collect \
            "chat-mentions" "$p4" "$log4" \
            "chat-layout-return" "$p5" "$log5"

      - name: Keep chat input profiles
        if: failure() && needs.scope.outputs.chat_checks == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-latency
          path: |
            ~/.cache/gloomberb-pane-chrome/chat-latency
            ~/.cache/gloomberb-pane-chrome/chat-lifecycle
            ~/.cache/gloomberb-pane-chrome/chat-pane-return
            ~/.cache/gloomberb-pane-chrome/chat-layout-return
          if-no-files-found: ignore

      - name: Keep screenshots of failed steps
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pane-chrome-failures
          path: ~/.cache/gloomberb-pane-chrome/failures
          if-no-files-found: ignore

  chat-webkit:
    name: Chat painting in WebKit
    needs: scope
    if: github.event.action != 'closed' && needs.scope.outputs.chat_checks == 'true'
    # Playwright 1.60's WebKit does not install on Ubuntu 26.04; lift when Playwright supports it
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-bun

      - name: Install WebKit
        timeout-minutes: 8
        uses: ./.github/actions/install-webkit

      - name: Paint chat in WebKit across mount, detached shell, channel opens, and window return
        shell: bash
        run: |
          set -euo pipefail
          collect() {
            local status=0
            while [ $# -gt 0 ]; do
              local label="$1" pid="$2" log="$3"
              shift 3
              if ! wait "$pid"; then
                status=1
                echo "::error title=Chat WebKit: ${label}::failed"
              fi
              echo "=== ${label} ==="
              cat "$log"
              rm -f "$log"
            done
            return "$status"
          }
          log1="$(mktemp)"; log2="$(mktemp)"
          bun scripts/pane-chrome/chat-latency.ts --webkit --lifecycle --multiple --arrival-on-mount --quick --repeat 3 --check --label chat-webkit >"$log1" 2>&1 & p1=$!
          bun scripts/pane-chrome/chat-latency.ts --webkit --lifecycle --detached --arrival-on-mount --quick --repeat 3 --check --label chat-webkit-detached >"$log2" 2>&1 & p2=$!
          collect \
            "chat-webkit" "$p1" "$log1" \
            "chat-webkit-detached" "$p2" "$log2"

          log3="$(mktemp)"; log4="$(mktemp)"; log5="$(mktemp)"
          bun scripts/pane-chrome/chat-latency.ts --webkit --open-only --quick --check --label chat-webkit-open >"$log3" 2>&1 & p3=$!
          bun scripts/pane-chrome/chat-latency.ts --webkit --pane-return --quick --check --label chat-webkit-return >"$log4" 2>&1 & p4=$!
          bun scripts/pane-chrome/chat-latency.ts --webkit --layout-return --quick --check --label chat-webkit-layout-return >"$log5" 2>&1 & p5=$!
          collect \
            "chat-webkit-open" "$p3" "$log3" \
            "chat-webkit-return" "$p4" "$log4" \
            "chat-webkit-layout-return" "$p5" "$log5"

      - name: Keep chat paint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-webkit
          path: |
            ~/.cache/gloomberb-pane-chrome/chat-webkit/samples.json
            ~/.cache/gloomberb-pane-chrome/chat-webkit/*.png
            ~/.cache/gloomberb-pane-chrome/chat-webkit-detached/samples.json
            ~/.cache/gloomberb-pane-chrome/chat-webkit-detached/*.png
            ~/.cache/gloomberb-pane-chrome/chat-webkit-open/samples.json
            ~/.cache/gloomberb-pane-chrome/chat-webkit-open/*.png
            ~/.cache/gloomberb-pane-chrome/chat-webkit-return/samples.json
            ~/.cache/gloomberb-pane-chrome/chat-webkit-return/*.png
            ~/.cache/gloomberb-pane-chrome/chat-webkit-layout-return/samples.json
            ~/.cache/gloomberb-pane-chrome/chat-webkit-layout-return/*.png
          if-no-files-found: ignore
