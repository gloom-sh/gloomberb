name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 04:15 UTC nightly safety net running full tsc alongside PR bun check.
    - cron: "15 4 * * *"

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Main never cancels a
# run half done: a push waits for the one running and replaces any waiting, so
# the web terminal deploy at the end of a run is not starved by a burst of merges.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GLOOMBERB_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-bun
        with:
          desktop: "true"

      - name: Typecheck production runtimes and built-in plugin tests
        run: bun run typecheck

      # Fails on a promise in src/ that nothing awaits or handles, and on a
      # stale entry in src/architecture/floating-promise-allowlist.json.
      - name: Check for new floating promises
        run: bun run check:floating-promises

      # Fails on unused files, exports and dependencies. See knip.jsonc for
      # what it deliberately skips.
      - name: Check for unused code
        run: bun run knip

      # Fails when a built-in plugin changes without regenerating the published
      # manifest, which is what the plugin directory renders for built-ins.
      - name: Check the built-in plugin manifest
        run: bun run plugins:manifest:check

      # Fails when a plugin in the browser catalog declares a host the worker
      # proxy does not know about, which would ship broken on the web.
      - name: Check the web proxy allowlist
        run: bun run web:proxy-hosts:check

  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-bun
        with:
          desktop: "true"

      - name: Test
        run: bun run test:ci

      - name: Build Electrobun view
        run: bun run desktop:view:build

      - name: Build and audit browser app
        run: bun run web:audit

      # Reuses the bundle the audit step just built.
      - name: Dry-run Cloudflare Worker
        run: bunx wrangler deploy --dry-run --env production

      # build.ts also runs the x64 binaries on an emulated CPU without AVX2.
      - name: Install QEMU's user-mode emulator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user

      # The musl one is smoke tested in an Alpine container.
      - name: Build core binaries
        run: bun run scripts/build.ts --target linux-x64 --target linux-x64-musl

      - name: Test global upgrade from 0.5.0
        run: bun run test:global-upgrade

  # Fails when a plugin the registry lists, at the commit the registry
  # reviewed or the ref it would install, imports a host export this change
  # does not have, or fails to load in the packaged terminal binary and the
  # desktop's bundled terminal entry. Compiling against sources alone does not
  # reach what a packaged host serves to a plugin (v0.19.3 to v0.19.5 shipped a
  # binary whose React had no named exports, and every plugin failed to load).
  # Not a deploy gate: it reads other repositories, and the registry or a
  # plugin's own breakage only warns.
  #
  # Runs code from other repositories. Leaves no token on disk and restores no
  # Actions cache (code in it could still write one through the runner's token:
  # what matters is that no job that signs, publishes or deploys restores any,
  # and setup-bun's cache is off unless a job asks).
  registry-plugins:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Compile registry plugins against this host
        run: bun run plugins:registry:check

      # build.ts also runs the x64 binary on an emulated CPU without AVX2.
      - name: Install QEMU's user-mode emulator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user

      - name: Build the terminal binary
        run: bun run scripts/build.ts --target linux-x64

      - name: Load registry plugins in the packaged terminal
        run: bun run plugins:registry:packaged --terminal dist/gloomberb-linux-x64.gz --desktop-tui

  deploy-web:
    environment: web-production
    name: Deploy terminal to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - typecheck
      - build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Restores no Actions cache while it holds the deploy token.
      - uses: ./.github/actions/setup-bun

      - name: Build browser app
        run: bun run web:build

      - name: Deploy terminal Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --env production --message "$GITHUB_SHA"

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 https://term.gloom.sh/health >/dev/null \
              && curl --fail --silent --show-error --max-time 15 "https://term.gloom.sh/l/00000000000000000000000000000000?ref=$GITHUB_SHA" \
                | grep --fixed-strings --quiet '/assets/share/main-'; then
              exit 0
            fi
            sleep 5
          done
          echo "term.gloom.sh did not become healthy at $GITHUB_SHA" >&2
          exit 1

  tsc-nightly:
    name: Nightly tsc safety net
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          desktop: "true"

      - name: Run full tsc across all projects
        run: bun run scripts/typecheck-all.ts --tsc
