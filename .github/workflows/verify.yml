name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 04:15 UTC nightly safety net running full tsc alongside PR bun check.
    - cron: "15 4 * * *"

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Main never cancels a
# run half done: a push waits for the one running and replaces any waiting, so
# the web terminal deploy at the end of a run is not starved by a burst of merges.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GLOOMBERB_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  typecheck:
    if: github.event_name != 'schedule' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-bun
        with:
          desktop: "true"

      - name: Typecheck, floating promises, unused code, and manifests
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git fetch --depth=1 origin "$BASE_REF"
            fp_cmd=(bun run scripts/update-floating-promise-allowlist.ts --check --changed-from FETCH_HEAD)
          else
            fp_cmd=(bun run check:floating-promises)
          fi

          log_tc="$(mktemp)"; log_fp="$(mktemp)"; log_knip="$(mktemp)"; log_manifest="$(mktemp)"; log_proxy="$(mktemp)"
          bun run typecheck >"$log_tc" 2>&1 & p_tc=$!
          "${fp_cmd[@]}" >"$log_fp" 2>&1 & p_fp=$!
          bun run knip >"$log_knip" 2>&1 & p_knip=$!
          bun run plugins:manifest:check >"$log_manifest" 2>&1 & p_manifest=$!
          bun run web:proxy-hosts:check >"$log_proxy" 2>&1 & p_proxy=$!

          status=0
          for entry in \
            "typecheck:$p_tc:$log_tc" \
            "floating-promises:$p_fp:$log_fp" \
            "knip:$p_knip:$log_knip" \
            "plugins-manifest:$p_manifest:$log_manifest" \
            "web-proxy-hosts:$p_proxy:$log_proxy"
          do
            IFS=: read -r label pid log <<<"$entry"
            if ! wait "$pid"; then
              status=1
              echo "::error title=Verify ${label}::failed"
            fi
            echo "=== ${label} ==="
            cat "$log"
            rm -f "$log"
          done
          exit "$status"

  build-and-test:
    if: github.event_name != 'schedule' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-bun
        with:
          desktop: "true"

      - id: scope
        name: Check whether core binary packaging changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "core_binaries=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_REF"
          bun run scripts/verify-scope.ts --base FETCH_HEAD

      - name: Test
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            bun run scripts/test-parallel.ts --changed-from FETCH_HEAD
          else
            bun run test:ci
          fi

      - name: Build Electrobun view
        run: bun run desktop:view:build

      - name: Build and audit browser app
        run: bun run web:audit

      # Reuses the bundle the audit step just built.
      - name: Dry-run Cloudflare Worker
        run: bunx wrangler deploy --dry-run --env production

      # build.ts also runs the x64 binaries on an emulated CPU without AVX2.
      - name: Install QEMU's user-mode emulator
        if: steps.scope.outputs.core_binaries == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user

      # The musl one is smoke tested in an Alpine container.
      # Verify does not upload release archives, so skip level-9 gzip here.
      - name: Build core binaries
        if: steps.scope.outputs.core_binaries == 'true'
        run: bun run scripts/build.ts --target linux-x64 --target linux-x64-musl --no-compress

      - name: Test global upgrade from 0.5.0
        if: steps.scope.outputs.core_binaries == 'true'
        run: bun run test:global-upgrade

  # Fails when a plugin the registry lists, at the commit the registry
  # reviewed or the ref it would install, imports a host export this change
  # does not have, or fails to load in the packaged terminal binary and the
  # desktop's bundled terminal entry. Compiling against sources alone does not
  # reach what a packaged host serves to a plugin (v0.19.3 to v0.19.5 shipped a
  # binary whose React had no named exports, and every plugin failed to load).
  # Not a deploy gate: it reads other repositories, and the registry or a
  # plugin's own breakage only warns.
  #
  # On pull requests that only touch built-in plugins, docs, tests, or browser
  # view internals outside the public host exports, the scope step exits cleanly
  # without spending a binary build. Pushes to main and manual dispatches always
  # run the full suite.
  #
  # Runs code from other repositories. Leaves no token on disk and restores no
  # Actions cache (code in it could still write one through the runner's token:
  # what matters is that no job that signs, publishes or deploys restores any,
  # and setup-bun's cache is off unless a job asks).
  registry-plugins:
    if: github.event_name != 'schedule' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - id: scope
        name: Check whether host plugin exports or packaging changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "registry_plugins=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_REF"
          bun run scripts/verify-scope.ts --base FETCH_HEAD

      - name: Install dependencies
        if: steps.scope.outputs.registry_plugins == 'true'
        run: bun install --frozen-lockfile

      # Compile registry plugins against this checkout and build the packaged
      # terminal binary concurrently, keeping clean checkouts so the packaged
      # doctor check reuses them without cloning every repo a second time.
      # build-and-test already runs the binary smoke + QEMU checks.
      - name: Compile registry plugins and build packaged terminal
        if: steps.scope.outputs.registry_plugins == 'true'
        shell: bash
        run: |
          set -euo pipefail
          plugins_dir="${RUNNER_TEMP}/registry-plugins"
          log_check="$(mktemp)"; log_build="$(mktemp)"
          bun run plugins:registry:check --save-plugins-dir "$plugins_dir" >"$log_check" 2>&1 & p_check=$!
          bun run scripts/build.ts --target linux-x64 --skip-smoke --no-compress >"$log_build" 2>&1 & p_build=$!
          status=0
          if ! wait "$p_check"; then status=1; fi
          echo "=== plugins:registry:check ==="
          cat "$log_check"; rm -f "$log_check"
          if ! wait "$p_build"; then status=1; fi
          echo "=== build linux-x64 ==="
          cat "$log_build"; rm -f "$log_build"
          exit "$status"

      - name: Load registry plugins in the packaged terminal
        if: steps.scope.outputs.registry_plugins == 'true'
        run: bun run plugins:registry:packaged --plugins-dir "${RUNNER_TEMP}/registry-plugins" --terminal dist/gloomberb-linux-x64 --desktop-tui

  deploy-web:
    environment: web-production
    name: Deploy terminal to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - typecheck
      - build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Restores no Actions cache while it holds the deploy token.
      - uses: ./.github/actions/setup-bun

      - name: Build browser app
        run: bun run web:build

      - name: Deploy terminal Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --env production --message "$GITHUB_SHA"

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 https://term.gloom.sh/health >/dev/null \
              && curl --fail --silent --show-error --max-time 15 "https://term.gloom.sh/l/00000000000000000000000000000000?ref=$GITHUB_SHA" \
                | grep --fixed-strings --quiet '/assets/share/main-'; then
              exit 0
            fi
            sleep 5
          done
          echo "term.gloom.sh did not become healthy at $GITHUB_SHA" >&2
          exit 1

  tsc-nightly:
    name: Nightly tsc safety net
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          desktop: "true"

      - name: Run full tsc across all projects
        run: bun run scripts/typecheck-all.ts --tsc
