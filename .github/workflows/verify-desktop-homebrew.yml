name: Verify Desktop Homebrew Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Configure Apple signing
        uses: ./.github/actions/apple-signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_APPLEAPIKEY_BASE64: ${{ secrets.ELECTROBUN_APPLEAPIKEY_BASE64 }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}

      - name: Build signed desktop artifacts
        env:
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
        run: bun run desktop:release

      - name: Build and verify Homebrew archives
        run: |
          set -euo pipefail
          brew install zstd
          test "$(uname -m)" = arm64
          smoke_root="$HOME/.cache/gloom-smoke/desktop-verify"
          mkdir -p "$smoke_root"
          tmp_dir="$(mktemp -d "$smoke_root/macos package.XXXXXX")"
          trap 'rm -rf "${tmp_dir:?}"' EXIT
          zstd -d -o "$tmp_dir/Gloom.app.tar" artifacts/stable-macos-arm64-Gloom.app.tar.zst
          tar -xf "$tmp_dir/Gloom.app.tar" -C "$tmp_dir"
          app="$tmp_dir/Gloom.app"

          test -x "$app/Contents/Resources/gloom"
          test -x "$app/Contents/Resources/gloomberb"
          test -f "$app/Contents/Resources/gloomberb-tui/tui-entry.js"
          test -f "$app/Contents/Resources/gloomberb-tui/node_modules/@opentui/core-darwin-arm64/index.js"
          test -f "$app/Contents/Resources/gloomberb-tui/node_modules/@opentui/core-darwin-arm64/libopentui.dylib"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$app/Contents/Info.plist" | grep -qx Gloom
          bun scripts/verify-desktop-cli.ts \
            "$app/Contents/Resources/gloom" \
            artifacts/macos-cli-verification
          "$app/Contents/Resources/gloomberb" help >/dev/null

          codesign --verify --verbose=4 "$app"
          ditto -c -k --keepParent "$app" artifacts/stable-macos-arm64-Gloom.app.zip
          # The same signed bundle under its old name, for a Homebrew cask that
          # still installs Gloomberb.app. Its signature does not cover the name.
          mv "$app" "$tmp_dir/Gloomberb.app"
          codesign --verify --verbose=4 "$tmp_dir/Gloomberb.app"
          "$tmp_dir/Gloomberb.app/Contents/Resources/gloom" help >/dev/null
          ditto -c -k --keepParent "$tmp_dir/Gloomberb.app" artifacts/stable-macos-arm64-Gloomberb.app.zip

      - name: Write the desktop files under the app's old name
        run: bun scripts/write-legacy-desktop-files.ts artifacts

      - name: Verify desktop artifacts
        run: |
          set -euo pipefail
          for file in Gloom.dmg Gloom.app.tar.zst Gloom.app.zip update.json Gloomberb.dmg Gloomberb.app.tar.zst Gloomberb.app.zip; do
            test -f "artifacts/stable-macos-arm64-$file" || { echo "Missing stable-macos-arm64-$file" >&2; exit 1; }
          done
          cmp artifacts/stable-macos-arm64-Gloom.app.tar.zst artifacts/stable-macos-arm64-Gloomberb.app.tar.zst
          codesign --verify --verbose=4 artifacts/stable-macos-arm64-Gloom.dmg
          xcrun stapler validate -v artifacts/stable-macos-arm64-Gloom.dmg

      # What an install from before the rename has once its updater put this
      # build in Gloomberb.app: started there, it renames itself to Gloom.app,
      # moves the install script's command links and opens again.
      - name: Verify a Gloomberb.app install takes the new name
        run: |
          set -euo pipefail
          root="$HOME/.cache/gloom-smoke/desktop-rename"
          rm -rf "$root"
          mkdir -p "$root/Applications" "$HOME/.local/bin"
          ditto -x -k artifacts/stable-macos-arm64-Gloomberb.app.zip "$root/Applications"
          ln -sfn "$root/Applications/Gloomberb.app/Contents/Resources/gloom" "$HOME/.local/bin/gloom"
          ln -sfn "$root/Applications/Gloomberb.app/Contents/Resources/gloomberb" "$HOME/.local/bin/gloomberb"
          GLOOMBERB_HOME="$root/profile" "$root/Applications/Gloomberb.app/Contents/MacOS/launcher" >"$root/launch.log" 2>&1 &
          for _ in $(seq 1 90); do [ -d "$root/Applications/Gloom.app" ] && break; sleep 1; done
          relaunched=""
          for _ in $(seq 1 90); do
            if pgrep -f "$root/Applications/Gloom.app/Contents/MacOS" >/dev/null; then relaunched=yes; break; fi
            sleep 1
          done
          pkill -f "$root/Applications/Gloom" || true
          cat "$root/launch.log"
          ls -la "$root/Applications" "$HOME/.local/bin"
          test -d "$root/Applications/Gloom.app"
          test ! -e "$root/Applications/Gloomberb.app"
          test "$(readlink "$HOME/.local/bin/gloom")" = "$root/Applications/Gloom.app/Contents/Resources/gloom"
          test "$(readlink "$HOME/.local/bin/gloomberb")" = "$root/Applications/Gloom.app/Contents/Resources/gloomberb"
          "$HOME/.local/bin/gloom" help >/dev/null
          "$HOME/.local/bin/gloomberb" help >/dev/null
          codesign --verify --verbose=4 "$root/Applications/Gloom.app"
          test "$relaunched" = yes

      # The ids the view keeps in its WebKit storage have a copy in the data
      # folder, which a build under another bundle identifier, starting with
      # empty storage, takes them back from. The copy here holds them and one
      # key the view does not keep: the view puts its three into its storage,
      # reads them back from there and writes the copy again with exactly those.
      - name: Verify the view takes its ids back from the copy on disk
        run: |
          set -euo pipefail
          root="$HOME/.cache/gloom-smoke/desktop-view-ids"
          rm -rf "$root"
          mkdir -p "$root/Applications" "$root/profile"
          ditto -x -k artifacts/stable-macos-arm64-Gloom.app.zip "$root/Applications"
          cat >"$root/expected.json" <<'JSON'
          {"gloomberb.sync.clientId":"client_verify-macos","gloomberb.web.anonymous-id":"0f9d5c1a-58a4-4b6e-9a31-2c1d2b7e8f00","gloomberb.web.attribution":"{\"first_touch_at\":\"2026-10-01T00:00:00.000Z\"}"}
          JSON
          bun -e 'const ids = JSON.parse(await Bun.file(process.argv[1]).text()); await Bun.write(process.argv[2], JSON.stringify({ ...ids, "gloomberb.verify.unkept": "not the view'\''s" }))' \
            "$root/expected.json" "$root/profile/desktop-view-ids.json"
          GLOOMBERB_HOME="$root/profile" "$root/Applications/Gloom.app/Contents/MacOS/launcher" >"$root/launch.log" 2>&1 &
          for _ in $(seq 1 90); do
            grep -q gloomberb.verify.unkept "$root/profile/desktop-view-ids.json" 2>/dev/null || break
            sleep 1
          done
          pkill -f "$root/Applications/Gloom.app" || true
          cat "$root/profile/desktop-view-ids.json"; echo
          bun -e 'const [saved, expected] = await Promise.all(process.argv.slice(1).map((path) => Bun.file(path).json())); if (Bun.deepEquals(saved, expected)) process.exit(0); console.error("The view did not keep its ids through its storage"); process.exit(1)' \
            "$root/profile/desktop-view-ids.json" "$root/expected.json" || { cat "$root/launch.log"; exit 1; }
          rm -rf "$root"

      # An install from before the bundle identifier changed keeps its
      # downloaded updates in Application Support under the old one. Started,
      # this build moves that folder under the new one.
      - name: Verify the app moves its folder to the new bundle identifier
        run: |
          set -euo pipefail
          support="$HOME/Library/Application Support"
          legacy="$support/com.vincelwt.gloomberb"
          root="$HOME/.cache/gloom-smoke/desktop-identifier"
          rm -rf "$root" "$legacy"
          mkdir -p "$root/Applications" "$root/profile" "$legacy/stable/self-extraction"
          echo "the update the old build downloaded" >"$legacy/stable/self-extraction/0123abcd.tar"
          ditto -x -k artifacts/stable-macos-arm64-Gloom.app.zip "$root/Applications"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$root/Applications/Gloom.app/Contents/Info.plist" | grep -qx sh.gloom.desktop
          GLOOMBERB_HOME="$root/profile" "$root/Applications/Gloom.app/Contents/MacOS/launcher" >"$root/launch.log" 2>&1 &
          for _ in $(seq 1 60); do [ -e "$legacy" ] || break; sleep 1; done
          pkill -f "$root/Applications/Gloom.app" || true
          ls -la "$support"
          test ! -e "$legacy" || { cat "$root/launch.log"; exit 1; }
          grep -qx "the update the old build downloaded" "$support/sh.gloom.desktop/stable/self-extraction/0123abcd.tar"
          rm -rf "$root"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-desktop-cli-verification
          path: artifacts/macos-cli-verification

      - name: Verify cask generation and tap access
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?missing HOMEBREW_TAP_TOKEN secret}"

          sha256="$(shasum -a 256 artifacts/stable-macos-arm64-Gloom.app.zip | awk '{print $1}')"
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          gh repo clone vincelwt/homebrew-tap "$tap_dir"
          git -C "$tap_dir" remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/vincelwt/homebrew-tap.git"
          bun run scripts/write-homebrew-cask.ts \
            --version "0.0.0" \
            --sha256 "$sha256" \
            --output "$tap_dir/Casks/gloomberb.rb"

          ruby -c "$tap_dir/Casks/gloomberb.rb"
          grep -q 'stable-macos-arm64-Gloom.app.zip' "$tap_dir/Casks/gloomberb.rb"
          grep -q 'app "Gloom.app"' "$tap_dir/Casks/gloomberb.rb"
          grep -q 'depends_on arch: :arm64' "$tap_dir/Casks/gloomberb.rb"
          grep -q 'binary "#{appdir}/Gloom.app/Contents/Resources/gloom", target: "gloom"' "$tap_dir/Casks/gloomberb.rb"
          grep -q 'binary "#{appdir}/Gloom.app/Contents/Resources/gloomberb", target: "gloomberb"' "$tap_dir/Casks/gloomberb.rb"

          cd "$tap_dir"
          git add Casks/gloomberb.rb
          git commit -m "Verify cask update" --allow-empty
          git push --dry-run origin HEAD:homebrew-verify-${GITHUB_RUN_ID}
