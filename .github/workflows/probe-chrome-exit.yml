name: Probe browser exit on Windows

on:
  push:
    branches:
      - fix/ci-flakes-wal-windows-cleanup
    paths:
      - ".github/workflows/probe-chrome-exit.yml"
      - "scripts/probe-chrome-exit.ts"

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun scripts/probe-chrome-exit.ts
