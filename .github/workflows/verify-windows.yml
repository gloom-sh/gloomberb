name: Verify Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: verify-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Test
        run: bun test src/updater/index.test.ts src/app/global-shortcuts.test.tsx src/plugins/host-link.test.ts src/plugins/loader.test.ts

      - name: Build standalone CLI
        run: bun run scripts/build.ts

      - name: Verify standalone CLI artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\gloomberb-windows-x64.exe.gz")) {
            throw "Missing standalone Windows CLI archive"
          }

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Test Windows verification diagnostics
        shell: pwsh
        run: ./scripts/verify-windows-diagnostics.test.ps1

      # Windows PowerShell 5.1, which the app runs the script with.
      - name: Test the script that moves an update into the installer's folder
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/verify-windows-installer-folder.test.ps1

      - name: Build Windows desktop package
        shell: pwsh
        run: ./scripts/build-windows-desktop-package.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1

      - name: Write the desktop files under the app's old name
        shell: pwsh
        run: bun scripts/write-legacy-desktop-files.ts artifacts

      - name: Verify Windows desktop artifacts
        shell: pwsh
        run: ./scripts/verify-windows-desktop.ps1

      - name: Verify an installed app updates in place
        shell: pwsh
        run: ./scripts/verify-windows-update.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-desktop-update-verification
          path: artifacts/windows-update-verification

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-desktop-cli-verification
          path: artifacts/windows-cli-verification

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: artifacts/stable-win-x64-GloomSetup.exe
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gloomberb-windows-x64-package
          path: artifacts/*

  # Windows on Arm runs the x64 app under emulation, where a build can open its
  # window and crash seconds later while it runs fine on x64.
  desktop-arm:
    needs: desktop
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          path: installer

      - name: Open the installed app and check it stays up
        shell: pwsh
        run: ./scripts/verify-windows-stays-up.ps1 -Installer installer/stable-win-x64-GloomSetup.exe -Label arm64 -Seconds 90

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-arm64-stays-up
          path: artifacts/windows-stays-up
