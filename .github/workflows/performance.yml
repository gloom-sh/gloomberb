name: Performance

# Separate from Verify so a noisy runner never blocks the checks a merge needs.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tui-benchmarks:
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Check out the base branch next to the PR
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../base FETCH_HEAD
          cd ../base && bun install --frozen-lockfile

      # Fails when the typical keypress is clearly slower than on the base
      # branch; the table lands in the job summary either way.
      - name: Compare navigation speed with the base branch
        run: bun run benchmark:tui:compare --base ../base

      # Fails when browsing more tickers keeps growing the live heap.
      - name: Check memory levels off while browsing tickers
        run: bun run benchmark:tui:memory

  # The pane drag budget only means something for pane chrome changes: the
  # pull_request paths of the Pane chrome workflow, or this workflow.
  pane-drag-scope:
    name: Pane drag scope
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - id: scope
        name: Check whether the change touches pane chrome
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          bun run scripts/pane-chrome/scope.ts FETCH_HEAD .github/workflows/performance.yml

  pane-drag-budget:
    name: Pane drag frame budget
    needs: pane-drag-scope
    if: needs.pane-drag-scope.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - id: chrome
        name: Read the pinned Chrome version
        run: echo "version=$(sed -n 's/^const CHROME_VERSION = "\(.*\)";$/\1/p' scripts/pane-chrome/browser.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/gloomberb-pane-chrome/chrome-headless-shell-${{ steps.chrome.outputs.version }}
          key: chrome-headless-shell-${{ steps.chrome.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Check out the base branch next to the PR
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../base FETCH_HEAD
          cd ../base && bun install --frozen-lockfile

      # Fails when dragging or resizing a pane clearly costs the main thread
      # more per frame, or renders React more, than on the base branch, or
      # when a resized frame falls behind the pointer; the table lands in the
      # job summary either way.
      - name: Compare a pane drag's frame budget with the base branch
        run: bun run benchmark:pane-drag:compare --base ../base

  # How long the app's database work holds the app's thread, on Windows,
  # where a flush of the disk held it for seconds. Only for changes to the
  # data layer, the check or this workflow.
  app-database-windows:
    name: App database on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: scope
        name: Check whether the change touches the data layer
        shell: bash
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only FETCH_HEAD HEAD | grep -E '^(src/data/|scripts/benchmark-app-database\.ts|\.github/workflows/performance\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      # The data layer needs no packages: Bun alone runs both checkouts.
      - if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - if: steps.scope.outputs.relevant == 'true'
        name: Check out the base branch next to the PR
        shell: bash
        run: git worktree add ../base FETCH_HEAD

      # The same seeded 100 MB cache and workload against both checkouts; the
      # table lands in the job summary.
      - if: steps.scope.outputs.relevant == 'true'
        name: Compare the app database's time on the app's thread with the base branch
        run: bun scripts/benchmark-app-database.ts --base ../base --seconds 45 --runs 2 --out app-database.json

      - if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-database-windows
          path: app-database.json
          if-no-files-found: ignore

  # How long one Cloud sync blocks the desktop view on a large workspace, in
  # WebKit. Only for changes to the sync, the portfolio analytics it values,
  # the desktop view's RPC path (Electrobun's patch included), or the check.
  sync-budget:
    name: Cloud sync main-thread budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - id: scope
        name: Check whether the change touches the sync or the desktop RPC path
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only FETCH_HEAD HEAD | grep -E '^(src/sync/|src/plugins/builtin/analytics/metrics\.ts|src/renderers/electrobun/|src/utils/http-proxy-response\.ts|patches/electrobun|scripts/pane-chrome/sync-poll|\.github/workflows/performance\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-bun

      - if: steps.scope.outputs.relevant == 'true'
        name: Install the pinned WebKit build and system libraries
        run: bun node_modules/playwright-core/cli.js install --with-deps webkit

      # Fails when an unchanged, a repriced or an edited workspace's sync, or
      # a 4 MB message through the preload codec, blocks the main thread past
      # its budget, or when an unchanged workspace is uploaded again.
      - if: steps.scope.outputs.relevant == 'true'
        name: Check a Cloud sync's longest main-thread block
        run: bun scripts/pane-chrome/sync-poll.ts --check --label sync-poll

      - if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sync-poll
          path: ~/.cache/gloomberb-pane-chrome/sync-poll/samples.json
          if-no-files-found: ignore
