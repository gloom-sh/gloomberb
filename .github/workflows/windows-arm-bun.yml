name: Windows on Arm launch repro, Bun builds

on:
  push:
    branches:
      - chore/windows-arm-repro
    paths:
      - .github/workflows/windows-arm-bun.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stays-up:
    strategy:
      fail-fast: false
      matrix:
        bun: [as-shipped, baseline]
        attempt: [1, 2, 3, 4]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Open v0.19.1 three times
        shell: pwsh
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP "GloomSetup-v0.19.1.exe"
          Invoke-WebRequest "https://github.com/gloom-sh/gloomberb/releases/download/v0.19.1/stable-win-x64-GloomSetup.exe" -OutFile $Installer
          $Bun = ""
          if ("${{ matrix.bun }}" -eq "baseline") {
            $Zip = Join-Path $env:RUNNER_TEMP "bun-baseline.zip"
            Invoke-WebRequest "https://github.com/oven-sh/bun/releases/download/bun-v1.3.13/bun-windows-x64-baseline.zip" -OutFile $Zip
            Expand-Archive $Zip -DestinationPath (Join-Path $env:RUNNER_TEMP "bun-baseline")
            $Bun = Join-Path $env:RUNNER_TEMP "bun-baseline\bun-windows-x64-baseline\bun.exe"
          }
          $Failed = @()
          foreach ($Launch in 1, 2, 3) {
            $Label = "${{ matrix.bun }}-${{ matrix.attempt }}-$Launch"
            try {
              ./scripts/verify-windows-stays-up.ps1 -Installer $Installer -Label $Label -Seconds 40 -ReplaceBun $Bun
            } catch {
              $Failed += "${Label}: $($_.Exception.Message)"
            }
          }
          if ($Failed.Count -gt 0) { throw ($Failed -join "; ") }
