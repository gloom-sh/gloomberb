name: Spike chart raster kernel

# Prototype measurements only. Profiles the heavy layout in the web build
# (scripts/spike/profile-heavy.ts), builds the chart raster kernel
# (kernels/chart-raster) to WebAssembly, and benchmarks it against the
# TypeScript raster on the same panels in Chrome, in Bun and in the desktop
# window on each platform (scripts/spike/desktop-measure.ts, heavy layout and
# kernel scenarios). Publishes nothing.
on:
  push:
    branches:
      - "spike/wasm-kernel"
  workflow_dispatch:

concurrency:
  group: spike-kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SPIKE_SHELL: electrobun-1.18.1
  SPIKE_UNSIGNED: "1"
  GLOOMBERB_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  web-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rebuild the kernel and compare with the committed module
        continue-on-error: true
        run: |
          rustc --version
          cp src/components/chart/composite/raster-kernel.generated.ts "$RUNNER_TEMP/committed.ts"
          bun scripts/spike/build-wasm.ts
          if diff -q "$RUNNER_TEMP/committed.ts" src/components/chart/composite/raster-kernel.generated.ts; then
            echo "Kernel rebuilt byte for byte with $(rustc --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Kernel rebuilt with $(rustc --version) differs from the committed module; the committed one is measured" | tee -a "$GITHUB_STEP_SUMMARY"
            cp "$RUNNER_TEMP/committed.ts" src/components/chart/composite/raster-kernel.generated.ts
          fi

      - name: Kernel tests (Rust)
        working-directory: kernels/chart-raster
        run: cargo test --release

      - name: Build the web app with names and source maps
        run: bun run scripts/build-web.ts --keep-names --sourcemap

      - name: Profile the heavy layout and benchmark the kernel in Chrome
        run: bun scripts/spike/profile-heavy.ts --out spike-profile

      - name: Benchmark the kernel in Bun on the same panels
        run: bun scripts/spike/bench-raster.ts --panels spike-profile/panels.json --out spike-profile

      - name: Summary
        if: always()
        run: |
          {
            sed -n '1,/^### load/p' spike-profile/profile.md | head -n -1
            sed -n '/^## Raster kernel in place/,$p' spike-profile/profile.md
            echo
            echo "## Raster kernel benchmark in Bun"
            echo
            echo '```json'
            bun -e 'const r = await Bun.file("spike-profile/bench-bun.json").json(); delete r.tsSamples; delete r.wasmSamples; console.log(JSON.stringify(r, null, 2))'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-web-profile
          path: spike-profile

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun

      - name: Build the desktop app (stable, unsigned)
        run: bun run desktop:release

      - name: Install it as an update or Homebrew would
        run: |
          set -euo pipefail
          ls -l artifacts
          command -v zstd || brew install zstd
          mkdir -p "$RUNNER_TEMP/app"
          zstd -d -o "$RUNNER_TEMP/app.tar" artifacts/stable-macos-arm64-Gloom.app.tar.zst
          tar -xf "$RUNNER_TEMP/app.tar" -C "$RUNNER_TEMP/app"
          ls "$RUNNER_TEMP/app"
          {
            echo "## Sizes"
            echo
            echo "| file | bytes |"
            echo "|---|---|"
            for file in artifacts/*; do echo "| $(basename "$file") | $(stat -f %z "$file") |"; done
            echo "| installed Gloom.app | $(du -sk "$RUNNER_TEMP/app/Gloom.app" | cut -f1)000 (du KB x1000) |"
          } | tee -a "$GITHUB_STEP_SUMMARY" > sizes.md

      - name: Can System Events drive windows here
        continue-on-error: true
        run: osascript -e 'tell application "System Events" to get name of every process whose background only is false'

      - name: Measure
        run: |
          app="$RUNNER_TEMP/app/Gloom.app"
          bun scripts/spike/desktop-measure.ts --skip default --skip multi --skip window --shell "$SPIKE_SHELL" --platform-label macos-arm64 \
            --launch "$app/Contents/MacOS/launcher" \
            --view-html "$app/Contents/Resources/app/views/mainview/index.html" \
            --app-root "$app" --out spike-results --window-probe scripts/spike/mac-window-probe.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-macos-arm64
          path: |
            spike-results
            sizes.md
            artifacts/*.json

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # The desktop window's Chromium answers DevTools here, for the profile.
      SPIKE_CDP_PORT: "9333"
      SPIKE_KEEP_NAMES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun

      - name: Build the desktop package
        shell: pwsh
        run: ./scripts/build-windows-desktop-package.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: spike-windows-installer
          path: artifacts/stable-win-x64-GloomSetup.exe
          retention-days: 5

      - name: Larger screen
        continue-on-error: true
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Set-DisplayResolution: $($_.Exception.Message)" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List

      - name: Install
        id: install
        shell: pwsh
        run: ./scripts/spike/win-install.ps1 -Installer artifacts/stable-win-x64-GloomSetup.exe

      - name: Measure
        shell: pwsh
        run: |
          $Folder = "${{ steps.install.outputs.folder }}"
          bun scripts/spike/desktop-measure.ts --skip default --skip multi --skip window --shell $env:SPIKE_SHELL --platform-label windows-x64 `
            --launch "$Folder\bin\launcher.exe" `
            --view-html "$Folder\Resources\app\views\mainview\index.html" `
            --app-root $Folder --out spike-results --window-probe scripts/spike/win-window-probe.ps1

      - name: Profile the heavy layout in the desktop window
        if: always()
        shell: pwsh
        run: |
          $Folder = "${{ steps.install.outputs.folder }}"
          bun scripts/spike/profile-heavy.ts --desktop "$Folder\bin\launcher.exe" --cdp-port 9333 `
            --dist "$Folder\Resources\app\views\mainview" --out spike-desktop-profile
          Get-Content spike-desktop-profile/profile.md -TotalCount 120 | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-windows-x64
          path: |
            spike-results
            spike-desktop-profile
            sizes.md

  windows-arm64:
    needs: windows-x64
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@v4
        with:
          name: spike-windows-installer
          path: installer

      - name: Install
        id: install
        shell: pwsh
        run: ./scripts/spike/win-install.ps1 -Installer installer/stable-win-x64-GloomSetup.exe

      - name: Measure
        shell: pwsh
        run: |
          $Folder = "${{ steps.install.outputs.folder }}"
          bun scripts/spike/desktop-measure.ts --skip default --skip multi --skip window --shell $env:SPIKE_SHELL --platform-label windows-arm64 `
            --launch "$Folder\bin\launcher.exe" `
            --view-html "$Folder\Resources\app\views\mainview\index.html" `
            --app-root $Folder --out spike-results --window-probe scripts/spike/win-window-probe.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-windows-arm64
          path: |
            spike-results
            sizes.md

  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun

      - name: System libraries, a display and a window manager
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 xvfb openbox xdotool wmctrl x11-utils zstd

      - name: Build the desktop app (stable)
        run: bun node_modules/electrobun/bin/electrobun.cjs build --env=stable

      - name: Install it
        id: install
        run: |
          set -euo pipefail
          ls -l artifacts
          mkdir -p "$RUNNER_TEMP/app"
          archive="$(ls artifacts/*.tar.zst | head -1)"
          zstd -d -o "$RUNNER_TEMP/app.tar" "$archive"
          tar -xf "$RUNNER_TEMP/app.tar" -C "$RUNNER_TEMP/app"
          folder="$(dirname "$(dirname "$(find "$RUNNER_TEMP/app" -path '*/bin/launcher' | head -1)")")"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          {
            echo "## Sizes"
            echo
            echo "| file | bytes |"
            echo "|---|---|"
            for file in artifacts/*; do echo "| $(basename "$file") | $(stat -c %s "$file") |"; done
            echo "| installed folder | $(du -sb "$folder" | cut -f1) |"
          } | tee -a "$GITHUB_STEP_SUMMARY" > sizes.md

      - name: Measure
        run: |
          # Two 1920x1080 monitors side by side on one screen (RandR 1.5 monitors).
          Xvfb :99 -screen 0 3840x1080x24 -nolisten tcp &
          sleep 1
          DISPLAY=:99 xrandr --setmonitor LEFT 1920/508x1080/286+0+0 screen || true
          DISPLAY=:99 xrandr --setmonitor RIGHT 1920/508x1080/286+1920+0 none || true
          DISPLAY=:99 xrandr --listmonitors || true
          DISPLAY=:99 openbox &
          sleep 1
          folder="${{ steps.install.outputs.folder }}"
          DISPLAY=:99 bun scripts/spike/desktop-measure.ts --skip default --skip multi --skip window --shell "$SPIKE_SHELL" --platform-label linux-x64 \
            --launch "$folder/bin/launcher" \
            --view-html "$folder/Resources/app/views/mainview/index.html" \
            --app-root "$folder" --out spike-results --window-probe scripts/spike/linux-window-probe.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-linux-x64
          path: |
            spike-results
            sizes.md
