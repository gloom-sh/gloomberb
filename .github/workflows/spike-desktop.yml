name: Spike desktop shell

# Prototype measurements only: builds the desktop app in a Tauri shell with
# the Bun backend as a sidecar on each platform, unsigned, and measures
# startup, memory, window behaviour and size with
# scripts/spike/desktop-measure.ts. Publishes nothing.
on:
  push:
    branches:
      - "spike/desktop-shell-tauri"
  workflow_dispatch:

concurrency:
  group: spike-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SPIKE_SHELL: tauri-2
  GLOOMBERB_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  # A throwaway key: the updater artifacts are built to be measured, never served.
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: spike

jobs:
  build-measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
            bundles: app,dmg
          - os: windows-latest
            label: windows-x64
            bundles: nsis
          - os: windows-11-arm
            label: windows-arm64
            bundles: nsis
          - os: ubuntu-24.04
            label: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target

      - name: System libraries, a display and a window manager
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb openbox xdotool wmctrl x11-utils x11-xserver-utils

      - name: Larger screen
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Set-DisplayResolution: $($_.Exception.Message)" }

      - name: Build the view, the backend and the sidecar
        run: bun scripts/spike/build-tauri.ts

      - name: Updater signing key (throwaway)
        shell: bash
        run: |
          bunx @tauri-apps/cli@2 signer generate --ci -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" -w "$RUNNER_TEMP/updater.key"
          # The build takes the key as a path too.
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/updater.key" >> "$GITHUB_ENV"
          # Updater artifacts need the updater's public key in the config; no endpoint is ever asked.
          bun -e 'const dir = process.env.RUNNER_TEMP; const pubkey = (await Bun.file(`${dir}/updater.key.pub`).text()).trim(); await Bun.write(`${dir}/updater.json`, JSON.stringify({ plugins: { updater: { pubkey, endpoints: ["https://updates.invalid/latest.json"] } } }));'


      - name: Build the Tauri app
        working-directory: desktop-tauri/src-tauri
        shell: bash
        run: bunx @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/updater.json"

      - name: Sizes
        shell: bash
        run: |
          {
            echo "## Sizes (${{ matrix.label }})"
            echo
            echo "| file | bytes |"
            echo "|---|---|"
            find desktop-tauri/src-tauri/target/release/bundle -maxdepth 2 -type f | while read -r file; do
              echo "| ${file#desktop-tauri/src-tauri/target/release/bundle/} | $(wc -c < "$file" | tr -d ' ') |"
            done
            exe="desktop-tauri/src-tauri/target/release/Gloom"
            [ -f "$exe.exe" ] && exe="$exe.exe"
            echo "| shell binary $(basename "$exe") | $(wc -c < "$exe" | tr -d ' ') |"
            echo "| backend/index.js | $(wc -c < desktop-tauri/backend/index.js | tr -d ' ') |"
            echo "| sidecar bun | $(wc -c < "$(ls desktop-tauri/src-tauri/binaries/bun-* | head -1)" | tr -d ' ') |"
          } | tee -a "$GITHUB_STEP_SUMMARY" > sizes.md

      - name: Install (macOS)
        if: runner.os == 'macOS'
        id: mac
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          cp -R desktop-tauri/src-tauri/target/release/bundle/macos/Gloom.app "$RUNNER_TEMP/app/"
          echo "| installed Gloom.app | $(du -sk "$RUNNER_TEMP/app/Gloom.app" | cut -f1)000 (du KB x1000) |" | tee -a "$GITHUB_STEP_SUMMARY" >> sizes.md

      - name: Install (Windows)
        if: runner.os == 'Windows'
        id: install
        shell: pwsh
        run: |
          $Installer = (Get-ChildItem desktop-tauri/src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1).FullName
          Copy-Item sizes.md sizes-build.md
          ./scripts/spike/win-install.ps1 -Installer $Installer -Arguments "/S"
          Get-Content sizes-build.md | Add-Content sizes.md

      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb -x "$(ls desktop-tauri/src-tauri/target/release/bundle/deb/*.deb | head -1)" "$RUNNER_TEMP/deb"
          find "$RUNNER_TEMP/deb" -maxdepth 4 | head -30
          echo "| installed .deb tree | $(du -sb "$RUNNER_TEMP/deb" | cut -f1) |" | tee -a "$GITHUB_STEP_SUMMARY" >> sizes.md

      - name: Can System Events drive windows here
        if: runner.os == 'macOS'
        continue-on-error: true
        run: osascript -e 'tell application "System Events" to get name of every process whose background only is false'

      - name: Measure (macOS)
        if: runner.os == 'macOS'
        run: |
          app="$RUNNER_TEMP/app/Gloom.app"
          bun scripts/spike/desktop-measure.ts --shell "$SPIKE_SHELL" --platform-label ${{ matrix.label }} \
            --launch "$app/Contents/MacOS/Gloom" --probe-env \
            --app-root "$app" --out spike-results --window-probe scripts/spike/mac-window-probe.sh

      - name: Measure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Folder = "${{ steps.install.outputs.folder }}"
          bun scripts/spike/desktop-measure.ts --shell $env:SPIKE_SHELL --platform-label ${{ matrix.label }} `
            --launch "$Folder\Gloom.exe" --probe-env `
            --app-root $Folder --out spike-results --window-probe scripts/spike/win-window-probe.ps1

      - name: Measure (Linux)
        if: runner.os == 'Linux'
        run: |
          # Two 1920x1080 monitors side by side on one screen (RandR 1.5 monitors).
          Xvfb :99 -screen 0 3840x1080x24 -nolisten tcp &
          sleep 1
          DISPLAY=:99 xrandr --setmonitor LEFT 1920/508x1080/286+0+0 screen || true
          DISPLAY=:99 xrandr --setmonitor RIGHT 1920/508x1080/286+1920+0 none || true
          DISPLAY=:99 xrandr --listmonitors || true
          DISPLAY=:99 openbox &
          sleep 1
          DISPLAY=:99 bun scripts/spike/desktop-measure.ts --shell "$SPIKE_SHELL" --platform-label ${{ matrix.label }} \
            --launch "$RUNNER_TEMP/deb/usr/bin/Gloom" --probe-env \
            --app-root "$RUNNER_TEMP/deb" --out spike-results --window-probe scripts/spike/linux-window-probe.sh
          # WebKitGTK without its DMA-BUF renderer and the accessibility bus, as a check on Xvfb's first-paint delay.
          DISPLAY=:99 WEBKIT_DISABLE_DMABUF_RENDERER=1 NO_AT_BRIDGE=1 bun scripts/spike/desktop-measure.ts --shell "$SPIKE_SHELL-no-dmabuf" --platform-label ${{ matrix.label }} \
            --launch "$RUNNER_TEMP/deb/usr/bin/Gloom" --probe-env --runs 3 --skip multi --skip window \
            --app-root "$RUNNER_TEMP/deb" --out spike-results-no-dmabuf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-${{ matrix.label }}
          path: |
            spike-results
            spike-results-no-dmabuf
            sizes.md
