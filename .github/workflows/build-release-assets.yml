name: Build Release Assets

# The builds a release publishes: the terminal binaries, the signed and
# notarized macOS desktop app, and the Windows desktop installer. Release runs
# it for a stable tag as the tag is; Nightly runs it for a main commit under a
# nightly version, with the desktop files named nightly-* so they can never be
# taken for a stable manifest.
#
# The Windows jobs Authenticode-sign every program they ship once their
# signing environment sets ARTIFACT_SIGNING_PROFILE, and build unsigned files
# until then (.github/actions/windows-signing, scripts/windows-signing.ts).
#
# No registry plugin runs in these jobs, which hold the signing keys. The
# plugin check reads these builds after this workflow, in
# load-registry-plugins.yml, which callers run with no secrets.
#
# Each job attests the files it uploads, right before the upload: build
# provenance signed with an OIDC identity that names this workflow and the
# run, which no job outside this workflow can take on. The jobs that publish
# take only files attested here in their own run (scripts/check-built-files.ts),
# so whatever the plugin check did to the artifacts, in any attempt of the run,
# fails that check instead of passing it.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Empty builds the commit that started the run.
        type: string
        default: ""
      version:
        description: Version to build as, written to package.json in the runner only. Empty keeps package.json's.
        type: string
        default: ""
      channel:
        description: "stable keeps Electrobun's stable-* desktop file names; nightly renames them nightly-*."
        type: string
        default: stable
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_KEYCHAIN_PASSWORD:
        required: false
      ELECTROBUN_APPLEAPIKEY:
        required: false
      ELECTROBUN_APPLEAPIKEY_BASE64:
        required: false
      ELECTROBUN_APPLEAPIISSUER:
        required: false
      ELECTROBUN_DEVELOPER_ID:
        required: false
      # Secrets of the signing environments, which reach the Windows jobs only
      # when the caller passes them by name.
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false

permissions:
  contents: read

env:
  GLOOMBERB_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  build:
    # To attest what it uploads; see the top of this file.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      # A stable release publishes only once every entry here, and the one in
      # build-windows, has uploaded its binary: scripts/release-assets.ts reads
      # the assets from these matrices.
      matrix:
        include:
          - os: macos-latest
            asset: gloomberb-darwin-arm64
          # Intel Macs only get the terminal build. GitHub retires this runner
          # image in 2027; the desktop app stays Apple Silicon only.
          - os: macos-15-intel
            asset: gloomberb-darwin-x64
          - os: ubuntu-latest
            asset: gloomberb-linux-x64
          - os: ubuntu-24.04-arm
            asset: gloomberb-linux-arm64
          # Alpine and other musl systems. build.ts smoke tests them in an
          # Alpine container, since the runner itself is glibc.
          - os: ubuntu-latest
            asset: gloomberb-linux-x64-musl
            target: linux-x64-musl
          - os: ubuntu-24.04-arm
            asset: gloomberb-linux-arm64-musl
            target: linux-arm64-musl
          # Windows builds in build-windows, which signs.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Set the build version
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: npm pkg set "version=$BUILD_VERSION"

      # build.ts also runs the x64 Linux binaries on an emulated Nehalem CPU,
      # which has no AVX2 or BMI2, so a build that needs a newer CPU fails here.
      - name: Install QEMU's user-mode emulator
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user

      - name: Build
        run: bun run scripts/build.ts ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  # The Windows terminal binary, built as the matrix above builds the others,
  # in a job of its own so that the signing environment reaches only the jobs
  # that sign. Its matrix of one is where scripts/release-assets.ts reads its
  # asset from.
  build-windows:
    runs-on: windows-latest
    environment: ${{ inputs.channel == 'nightly' && 'signing-main' || 'release' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - asset: gloomberb-windows-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Set the build version
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: npm pkg set "version=$BUILD_VERSION"

      - name: Set up Windows code signing
        id: signing
        uses: ./.github/actions/windows-signing
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # With signing set up, build.ts signs the binary before its smoke tests
      # and before it gzips it.
      - name: Build
        run: bun run scripts/build.ts

      - name: Check the binary is signed
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: pwsh
        run: bun scripts/windows-signing.ts check dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  desktop-macos:
    runs-on: macos-latest
    environment: ${{ inputs.channel == 'nightly' && 'signing-main' || 'release' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          desktop: "true"

      - name: Set the build version
        if: ${{ inputs.version != '' }}
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: npm pkg set "version=$BUILD_VERSION"

      - name: Configure Apple signing
        id: signing
        uses: ./.github/actions/apple-signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_APPLEAPIKEY_BASE64: ${{ secrets.ELECTROBUN_APPLEAPIKEY_BASE64 }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}

      - name: Build signed desktop DMG
        env:
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
        run: bun run desktop:release

      # Signed, notarized and stapled: nothing after this signs.
      - name: Remove the signing keychain and notary key
        if: ${{ always() && steps.signing.outcome != 'skipped' }}
        uses: ./.github/actions/apple-signing
        with:
          cleanup: "true"

      - name: Build Homebrew app archives
        run: |
          set -euo pipefail
          brew install zstd
          tmp_dir="$(mktemp -d)"
          zstd -d -o "$tmp_dir/Gloom.app.tar" artifacts/stable-macos-arm64-Gloom.app.tar.zst
          tar -xf "$tmp_dir/Gloom.app.tar" -C "$tmp_dir"
          app="$tmp_dir/Gloom.app"
          test -x "$app/Contents/Resources/gloom"
          test -x "$app/Contents/Resources/gloomberb"
          test -f "$app/Contents/Resources/gloomberb-tui/tui-entry.js"
          test -f "$app/Contents/Resources/gloomberb-tui/node_modules/@opentui/core-darwin-arm64/index.js"
          test -f "$app/Contents/Resources/gloomberb-tui/node_modules/@opentui/core-darwin-arm64/libopentui.dylib"
          "$app/Contents/Resources/gloom" help
          "$app/Contents/Resources/gloomberb" help
          ditto -c -k --keepParent "$app" artifacts/stable-macos-arm64-Gloom.app.zip
          # The same signed bundle under its old name, for a Homebrew cask that
          # still installs Gloomberb.app. Its signature does not cover the name.
          mv "$app" "$tmp_dir/Gloomberb.app"
          codesign --verify --verbose=4 "$tmp_dir/Gloomberb.app"
          ditto -c -k --keepParent "$tmp_dir/Gloomberb.app" artifacts/stable-macos-arm64-Gloomberb.app.zip

      # Installs from before the rename ask the release for their update
      # archive under the old name; the download page names the old disk image.
      - name: Write the desktop files under the app's old name
        run: bun scripts/write-legacy-desktop-files.ts artifacts

      - name: Verify desktop artifacts
        run: |
          set -euo pipefail
          for file in Gloom.dmg Gloom.app.tar.zst Gloom.app.zip update.json Gloomberb.dmg Gloomberb.app.tar.zst Gloomberb.app.zip; do
            test -f "artifacts/stable-macos-arm64-$file" || { echo "Missing stable-macos-arm64-$file" >&2; exit 1; }
          done
          cmp artifacts/stable-macos-arm64-Gloom.app.tar.zst artifacts/stable-macos-arm64-Gloomberb.app.tar.zst
          codesign --verify --verbose=4 artifacts/stable-macos-arm64-Gloom.dmg
          xcrun stapler validate -v artifacts/stable-macos-arm64-Gloom.dmg

      - name: Name the desktop files for the nightly channel
        if: ${{ inputs.channel == 'nightly' }}
        run: |
          set -euo pipefail
          cd artifacts
          for file in stable-*; do mv "$file" "nightly-${file#stable-}"; done
          ls -l

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gloomberb-desktop-macos-arm64
          path: artifacts/*

  desktop-windows:
    runs-on: windows-latest
    environment: ${{ inputs.channel == 'nightly' && 'signing-main' || 'release' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          desktop: "true"

      - name: Set the build version
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: npm pkg set "version=$BUILD_VERSION"

      - name: Set up Windows code signing
        id: signing
        uses: ./.github/actions/windows-signing
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # With signing set up, Electrobun's postBuild script
      # (scripts/install-electrobun-tui-shim.ts) signs the app's programs
      # before Electrobun hashes them and packs the update archive.
      - name: Build Windows desktop package
        shell: pwsh
        run: ./scripts/build-windows-desktop-package.ps1

      # The pinned Inno Setup every workflow that builds the installer uses.
      - name: Install Inno Setup
        uses: ./.github/actions/inno-setup

      # Made from the signed programs in the update archive. With signing set
      # up, Inno Setup signs the setup and the engine copy it runs from the
      # temp folder.
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1

      # Installs from before the rename update from an archive under the old
      # name, holding a Gloomberb folder; the download page names the old installer.
      - name: Write the desktop files under the app's old name
        shell: pwsh
        run: bun scripts/write-legacy-desktop-files.ts artifacts

      # Every installer, and every program in either update archive.
      - name: Check every Windows program is signed
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: pwsh
        run: bun scripts/windows-signing.ts check artifacts

      - name: Verify Windows desktop artifacts
        shell: pwsh
        run: ./scripts/verify-windows-desktop.ps1

      # The screenshots and logs the verification judged, a failed run's too,
      # under a name the jobs that publish do not download. Named for the
      # attempt, so a rerun keeps the failed one's beside its own.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-desktop-verification-${{ github.run_attempt }}
          path: artifacts/windows-*-verification
          if-no-files-found: ignore

      - name: Keep only the release files
        shell: pwsh
        run: Remove-Item artifacts/windows-*-verification -Recurse -Force

      - name: Name the desktop files for the nightly channel
        if: ${{ inputs.channel == 'nightly' }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          for file in stable-*; do mv "$file" "nightly-${file#stable-}"; done
          ls -l

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*

      # Only once the build and its verification passed: a Windows build that
      # failed them uploads nothing, which holds the release back like any
      # other platform's missing files.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gloomberb-desktop-windows-x64
          path: artifacts/*

  # The catalog snapshot the npm package carries: `gloom catalog` and `fn` read it instead of loading every built-in
  # plugin. The binaries and the desktop app write their own while they build (scripts/build.ts). The job that
  # publishes to npm installs nothing, so it takes this file, attested here, and puts it in the package.
  catalog-snapshot:
    # Nightly publishes nothing to npm.
    if: ${{ inputs.channel != 'nightly' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Write the catalog snapshot
        run: bun run catalog:snapshot

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: src/cli/pane-functions/catalog-snapshot.json

      # Not named gloomberb-*: the release and nightly jobs download those into the folder they upload from.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog-snapshot
          path: src/cli/pane-functions/catalog-snapshot.json
          if-no-files-found: error
