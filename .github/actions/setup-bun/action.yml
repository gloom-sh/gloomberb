name: Set up Bun
description: Install the pinned Bun toolchain and locked dependencies

inputs:
  install:
    description: Install dependencies from bun.lock
    required: false
    default: "true"
  desktop:
    description: Fetch Electrobun's SDK into .hutch/devkit and patch it, for desktop builds, the type checks and the tests
    required: false
    default: "false"
  cache:
    description: >-
      Restore the Bun binary from the Actions cache, and save it there after a
      miss. Off unless a job asks, so a job added later restores nothing by
      accident: a cache written by one run is read by any later run that can
      see it, a job that runs code from outside the repository can write one
      (the runner's token is in its environment), and a job that signs,
      publishes or deploys must never restore one. Ask only in a job that
      holds no secrets and no write token, and only where it saves time: the
      download takes about as long as the restore.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - id: bun-version
      shell: bash
      run: |
        package_manager="$(node -p 'require("./package.json").packageManager')"
        echo "version=${package_manager#bun@}" >> "$GITHUB_OUTPUT"

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.bun-version.outputs.version }}
        no-cache: ${{ inputs.cache != 'true' }}

    - if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile

    # Electrobun 2 keeps its SDK out of node_modules: `electrobun sync` puts
    # the pinned release's in .hutch/devkit, where the desktop build, the
    # type checks and the tests read it, and our patch goes over it. Only the
    # jobs that need it ask, so an outage of Electrobun's servers cannot hold
    # up a web deploy or the terminal builds. The download is tried again
    # after a failure (an HTTP 503 once).
    - if: inputs.install == 'true' && inputs.desktop == 'true'
      shell: bash
      run: |
        for attempt in 1 2 3; do
          bun run desktop:sync && exit 0
          if [ "$attempt" -lt 3 ]; then
            echo "desktop:sync failed, trying again in $((attempt * 30)) s"
            sleep $((attempt * 30))
          fi
        done
        exit 1
