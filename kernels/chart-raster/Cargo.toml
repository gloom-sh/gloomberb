[package]
name = "chart-raster"
version = "0.1.0"
edition = "2021"
publish = false
description = "Prototype: the composite chart's pixel work (src/components/chart/native/raster/primitives.ts and the area fill) as one WebAssembly module"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
